<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AR Navigation v2.0</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  #shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,.34) 0%,
        rgba(0,0,0,.05) 18%,
        rgba(0,0,0,0) 48%,
        rgba(0,0,0,.08) 72%,
        rgba(0,0,0,.34) 100%);
  }

  #routeSvg {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  #routeShadow {
    fill: rgba(0,0,0,.14);
    filter: blur(3px);
  }
  #routeRibbon {
    fill: url(#routeFill);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.17));
  }
  #routeCore {
    fill: none;
    stroke: rgba(255,255,255,.14);
    stroke-width: 2;
    stroke-linecap: round;
  }
  #routeArrow {
    fill: url(#arrowFill);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.18));
  }

  #topStatus {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 14px;
    right: 14px;
    z-index: 8;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .pill {
    width: max-content;
    max-width: 100%;
    padding: 8px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.48);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
  }
  #versionLabel { justify-self: center; }
  #headingStatus { justify-self: end; }

  #targetMarker {
    position: absolute;
    z-index: 7;
    left: 50%;
    top: 40%;
    transform: translate(-50%,-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  #targetDot {
    width: 12px;
    height: 12px;
    border: 3px solid white;
    border-radius: 50%;
    background: rgba(15,95,255,.82);
    box-shadow: 0 2px 8px rgba(0,0,0,.55);
  }
  #targetLabel {
    padding: 6px 9px;
    border-radius: 999px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    background: rgba(0,0,0,.47);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(8px);
  }

  #edgeHint {
    position: absolute;
    z-index: 7;
    top: 43%;
    display: none;
    align-items: center;
    gap: 7px;
    padding: 9px 11px;
    border-radius: 999px;
    background: rgba(0,0,0,.52);
    border: 1px solid rgba(255,255,255,.15);
    color: white;
    font-size: 13px;
    font-weight: 700;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #edgeHint.left { left: 12px; }
  #edgeHint.right { right: 12px; }

  #debug {
    position: absolute;
    left: 14px;
    bottom: 88px;
    z-index: 9;
    display: none;
    padding: 9px 11px;
    border-radius: 12px;
    background: rgba(0,0,0,.52);
    color: white;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    pointer-events: none;
  }

  #controls {
    position: absolute;
    z-index: 10;
    left: 14px;
    right: 14px;
    bottom: max(18px, env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
  }
  button {
    min-height: 48px;
    flex: 1;
    border: 0;
    border-radius: 16px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    background: white;
    color: #111;
  }
  button.secondary {
    flex: 0 0 82px;
    background: rgba(20,20,20,.78);
    color: white;
    border: 1px solid rgba(255,255,255,.17);
  }
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <div id="shade"></div>

  <svg id="routeSvg" aria-hidden="true">
    <defs>
      <linearGradient id="routeFill" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#126DFF" stop-opacity=".72"></stop>
        <stop offset="58%" stop-color="#43A4FF" stop-opacity=".64"></stop>
        <stop offset="100%" stop-color="#8AD2FF" stop-opacity=".72"></stop>
      </linearGradient>
      <linearGradient id="arrowFill" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#3F9CFF" stop-opacity=".74"></stop>
        <stop offset="100%" stop-color="#A3DEFF" stop-opacity=".88"></stop>
      </linearGradient>
    </defs>
    <path id="routeShadow"></path>
    <path id="routeRibbon"></path>
    <path id="routeCore"></path>
    <path id="routeArrow"></path>
  </svg>

  <div id="topStatus">
    <div class="pill" id="gpsStatus">GPS 대기</div>
    <div class="pill" id="versionLabel">v2.0</div>
    <div class="pill" id="headingStatus">방향 대기</div>
  </div>

  <div id="targetMarker">
    <div id="targetDot"></div>
    <div id="targetLabel">목표</div>
  </div>

  <div id="edgeHint"></div>
  <div id="debug"></div>

  <div id="controls">
    <button id="startBtn">카메라 · 위치 · 방향 시작</button>
    <button id="debugBtn" class="secondary">정보</button>
  </div>
</div>

<script>
(() => {
  const TARGET = { lat: 37.5668260, lon: 126.9786567 };

  // 카메라 실제 FOV를 웹에서 정확히 얻기 어렵기 때문에 일반 후면 광각의
  // 체감값을 사용한다. 화면 밖 목표도 유도선 곡률에는 계속 반영한다.
  const H_FOV = 64;

  const camera = document.getElementById('camera');
  const routeRibbon = document.getElementById('routeRibbon');
  const routeShadow = document.getElementById('routeShadow');
  const routeCore = document.getElementById('routeCore');
  const routeArrow = document.getElementById('routeArrow');

  const targetMarker = document.getElementById('targetMarker');
  const targetLabel = document.getElementById('targetLabel');
  const edgeHint = document.getElementById('edgeHint');

  const gpsStatus = document.getElementById('gpsStatus');
  const headingStatus = document.getElementById('headingStatus');
  const debug = document.getElementById('debug');
  const startBtn = document.getElementById('startBtn');
  const debugBtn = document.getElementById('debugBtn');

  let currentPos = null;
  let targetBearing = null;
  let targetDistance = null;

  // raw sensor state
  let rawHeading = null;

  // filtered state
  let filteredHeading = null;
  let visualDiff = 0;
  let desiredDiff = 0;

  let rafId = null;
  let started = false;

  function toRad(d){ return d * Math.PI / 180; }
  function toDeg(r){ return r * 180 / Math.PI; }
  function norm360(d){ return (d % 360 + 360) % 360; }
  function norm180(d){ return ((d + 540) % 360) - 180; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function haversine(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dp = toRad(lat2-lat1), dl = toRad(lon2-lon1);
    const a = Math.sin(dp/2)**2 +
      Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function bearing(lat1, lon1, lat2, lon2){
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dl = toRad(lon2-lon1);
    const y = Math.sin(dl)*Math.cos(p2);
    const x = Math.cos(p1)*Math.sin(p2) -
      Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
    return norm360(toDeg(Math.atan2(y,x)));
  }

  function formatDistance(m){
    if(m == null) return '';
    if(m < 1000) return `${Math.round(m).toLocaleString()} m`;
    return `${(m/1000).toFixed(1)} km`;
  }

  function updateTargetFromGps(){
    if(!currentPos) return;

    targetBearing = bearing(
      currentPos.latitude, currentPos.longitude,
      TARGET.lat, TARGET.lon
    );

    targetDistance = haversine(
      currentPos.latitude, currentPos.longitude,
      TARGET.lat, TARGET.lon
    );

    targetLabel.textContent = `목표 ${formatDistance(targetDistance)}`;
  }

  function ingestHeading(newHeading){
    if(!Number.isFinite(newHeading)) return;

    rawHeading = norm360(newHeading);

    if(filteredHeading == null){
      filteredHeading = rawHeading;
      return;
    }

    const delta = norm180(rawHeading - filteredHeading);

    // 0.8도 이하는 사실상 정지로 취급.
    if(Math.abs(delta) < 0.8) return;

    // 센서가 크게 움직이면 따라가고, 작은 흔들림은 강하게 억제.
    const alpha =
      Math.abs(delta) > 35 ? 0.18 :
      Math.abs(delta) > 15 ? 0.115 :
      Math.abs(delta) > 6  ? 0.075 :
                             0.045;

    filteredHeading = norm360(filteredHeading + delta*alpha);
  }

  function handleOrientation(e){
    let h = null;

    if(typeof e.webkitCompassHeading === 'number'){
      h = e.webkitCompassHeading;
    }else if(typeof e.alpha === 'number'){
      h = 360 - e.alpha;
    }

    if(h != null) ingestHeading(h);
  }

  function buildRoute(diff){
    const W = window.innerWidth;
    const H = window.innerHeight;

    // 이미지 레퍼런스처럼 경로는 화면의 "도로 영역" 안에만 존재.
    const start = { x: W*0.5, y: H + 72 };
    const farY = H*0.47;

    // 화면상의 목표 위치. FOV 바깥이면 edge보다 조금 안쪽에서 경로가 끝난다.
    const screenRatio = clamp(diff/(H_FOV/2), -1.45, 1.45);
    const endX = W*0.5 + screenRatio*(W*0.38);
    const end = { x: endX, y: farY };

    // 회전량 0~180을 0~1로.
    const turn = clamp(Math.abs(diff)/180, 0, 1);
    const sign = diff >= 0 ? 1 : -1;

    // 레퍼런스 핵심:
    // 시작은 거의 곧게 뻗고, 필요할 때만 중후반부터 부드럽게 휜다.
    // 90° 이상에서는 곡률을 과장하지만 화면 안에서 끊김 없이 유지.
    const curveEase = Math.pow(turn, 0.72);

    const c1 = {
      x: start.x + sign*W*(0.015 + 0.035*curveEase),
      y: lerp(start.y, end.y, 0.40)
    };

    const c2 = {
      x: end.x - sign*W*(0.05 + 0.23*curveEase),
      y: lerp(start.y, end.y, 0.72)
    };

    function point(t){
      const mt = 1-t;
      return {
        x: mt*mt*mt*start.x +
           3*mt*mt*t*c1.x +
           3*mt*t*t*c2.x +
           t*t*t*end.x,
        y: mt*mt*mt*start.y +
           3*mt*mt*t*c1.y +
           3*mt*t*t*c2.y +
           t*t*t*end.y
      };
    }

    const pts = [];
    const steps = 56;
    for(let i=0;i<=steps;i++) pts.push(point(i/steps));

    const lengths = [0];
    let total = 0;
    for(let i=1;i<pts.length;i++){
      total += Math.hypot(
        pts[i].x-pts[i-1].x,
        pts[i].y-pts[i-1].y
      );
      lengths.push(total);
    }
    total ||= 1;

    const left = [];
    const right = [];

    for(let i=0;i<pts.length;i++){
      const prev = pts[Math.max(0,i-1)];
      const next = pts[Math.min(pts.length-1,i+1)];
      const dx = next.x-prev.x;
      const dy = next.y-prev.y;
      const len = Math.hypot(dx,dy) || 1;

      const nx = -dy/len;
      const ny = dx/len;

      const t = lengths[i]/total;

      // 바닥 원근 핵심:
      // 화면 가까운 쪽은 매우 넓고, 먼 쪽은 급격히 좁아진다.
      // 실제 HUD 이미지와 비슷하게 리본 자체가 "눕혀진" 인상을 만든다.
      const perspective = 1-Math.pow(1-t,2.65);
      const nearWidth = Math.min(W*0.34, 170);
      const farWidth = 24;
      const width = lerp(nearWidth, farWidth, perspective);
      const half = width/2;

      left.push({x:pts[i].x+nx*half,y:pts[i].y+ny*half});
      right.push({x:pts[i].x-nx*half,y:pts[i].y-ny*half});
    }

    function polygonPath(L,R){
      let d = `M ${L[0].x} ${L[0].y}`;
      for(let i=1;i<L.length;i++) d += ` L ${L[i].x} ${L[i].y}`;
      for(let i=R.length-1;i>=0;i--) d += ` L ${R[i].x} ${R[i].y}`;
      return d+' Z';
    }

    const ribbonD = polygonPath(left,right);

    // 중앙 하이라이트
    let coreD = `M ${pts[0].x} ${pts[0].y}`;
    for(let i=1;i<pts.length;i++){
      coreD += ` L ${pts[i].x} ${pts[i].y}`;
    }

    // 끝 화살촉을 리본과 한 몸처럼 생성.
    const pEnd = pts[pts.length-1];
    const pPrev = pts[pts.length-4];
    const vx = pEnd.x-pPrev.x;
    const vy = pEnd.y-pPrev.y;
    const vlen = Math.hypot(vx,vy)||1;
    const ux = vx/vlen;
    const uy = vy/vlen;
    const nx = -uy;
    const ny = ux;

    const arrowLen = clamp(H*0.075, 42, 72);
    const arrowHalf = 28;
    const baseBack = {
      x:pEnd.x-ux*arrowLen*0.72,
      y:pEnd.y-uy*arrowLen*0.72
    };
    const arrowD =
      `M ${pEnd.x+ux*arrowLen*0.38} ${pEnd.y+uy*arrowLen*0.38}` +
      ` L ${baseBack.x+nx*arrowHalf} ${baseBack.y+ny*arrowHalf}` +
      ` L ${pEnd.x-ux*arrowLen*0.08} ${pEnd.y-uy*arrowLen*0.08}` +
      ` L ${baseBack.x-nx*arrowHalf} ${baseBack.y-ny*arrowHalf} Z`;

    return { ribbonD, coreD, arrowD, end };
  }

  function renderRoute(){
    if(filteredHeading != null && targetBearing != null){
      desiredDiff = norm180(targetBearing-filteredHeading);
    }

    // 센서 필터와 별도로 화면 그래픽에도 easing.
    const delta = norm180(desiredDiff-visualDiff);
    const visualAlpha =
      Math.abs(delta) > 60 ? 0.095 :
      Math.abs(delta) > 20 ? 0.065 :
                             0.035;

    visualDiff += delta*visualAlpha;

    const route = buildRoute(visualDiff);
    routeRibbon.setAttribute('d',route.ribbonD);
    routeShadow.setAttribute('d',route.ribbonD);
    routeCore.setAttribute('d',route.coreD);
    routeArrow.setAttribute('d',route.arrowD);

    const W = window.innerWidth;
    const halfFov = H_FOV/2;
    const onScreen = Math.abs(visualDiff) <= halfFov;

    if(onScreen){
      const x = W*0.5 + (visualDiff/halfFov)*(W*0.38);
      targetMarker.style.display = 'flex';
      targetMarker.style.left = `${x}px`;
      targetMarker.style.top = `${window.innerHeight*0.40}px`;
      edgeHint.style.display = 'none';
    }else{
      targetMarker.style.display = 'none';
      edgeHint.style.display = 'flex';
      if(visualDiff < 0){
        edgeHint.className = 'left';
        edgeHint.textContent = `← 목표 ${formatDistance(targetDistance)}`;
      }else{
        edgeHint.className = 'right';
        edgeHint.textContent = `목표 ${formatDistance(targetDistance)} →`;
      }
    }

    if(filteredHeading != null){
      headingStatus.textContent = `방향 ${Math.round(filteredHeading)}°`;
    }

    debug.textContent =
`목표: ${TARGET.lat}, ${TARGET.lon}
현재: ${currentPos ? currentPos.latitude.toFixed(7)+', '+currentPos.longitude.toFixed(7) : '-'}
거리: ${targetDistance != null ? targetDistance.toFixed(1)+' m' : '-'}
목표 방위각: ${targetBearing != null ? targetBearing.toFixed(1)+'°' : '-'}
필터 헤딩: ${filteredHeading != null ? filteredHeading.toFixed(1)+'°' : '-'}
방향 차이: ${visualDiff.toFixed(1)}°`;

    rafId = requestAnimationFrame(renderRoute);
  }

  async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    camera.srcObject = stream;
  }

  function startGPS(){
    if(!navigator.geolocation){
      gpsStatus.textContent = 'GPS 미지원';
      return;
    }

    navigator.geolocation.watchPosition(pos=>{
      currentPos = {
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy
      };

      gpsStatus.textContent = `GPS ±${Math.round(pos.coords.accuracy)}m`;
      updateTargetFromGps();
    },err=>{
      gpsStatus.textContent = 'GPS 오류';
      console.error(err);
    },{
      enableHighAccuracy:true,
      maximumAge:400,
      timeout:15000
    });
  }

  async function startOrientation(){
    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      const result = await DeviceOrientationEvent.requestPermission();
      if(result !== 'granted') throw new Error('방향 센서 권한 거부');
    }

    if('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute',handleOrientation,true);
    }else{
      window.addEventListener('deviceorientation',handleOrientation,true);
    }
  }

  startBtn.addEventListener('click',async()=>{
    if(started) return;

    startBtn.disabled = true;
    startBtn.textContent = '시작 중…';

    try{
      await startCamera();
      startGPS();
      await startOrientation();

      started = true;
      startBtn.textContent = '실행 중';

      if(!rafId) rafId = requestAnimationFrame(renderRoute);
    }catch(err){
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = '권한 확인 후 다시 시작';
      alert('카메라·위치·방향 센서 권한을 허용해주세요. HTTPS 환경에서 실행해주세요.');
    }
  });

  debugBtn.addEventListener('click',()=>{
    debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
  });

  window.addEventListener('resize',()=>{
    if(!rafId) renderRoute();
  });

  // 권한 전에도 레이아웃 형태는 보이도록 초기 렌더.
  routeRibbon.setAttribute('d','');
  routeShadow.setAttribute('d','');
  routeCore.setAttribute('d','');
  routeArrow.setAttribute('d','');
})();
</script>
</body>
</html>
