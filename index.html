<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AR Navigation v4.5</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  #shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,.34) 0%,
        rgba(0,0,0,.05) 18%,
        rgba(0,0,0,0) 48%,
        rgba(0,0,0,.08) 72%,
        rgba(0,0,0,.34) 100%);
  }

  #routeSvg {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  #routeShadow {
    fill: rgba(0,0,0,.22);
    filter: blur(4px);
  }
  #routeRibbon {
    fill: url(#routeFill);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.22));
  }
  #routeRim {
    fill: none;
    stroke: rgba(220,242,255,.55);
    stroke-width: 2;
    stroke-linecap: round;
  }

  #topStatus {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 14px;
    right: 14px;
    z-index: 8;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .pill {
    width: max-content;
    max-width: 100%;
    padding: 8px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.48);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
  }
  #versionLabel { justify-self: center; }
  #headingStatus { justify-self: end; }

  /* 하단 HUD: 거리 */
  #bottomHud {
    position: absolute;
    z-index: 9;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(96px, calc(env(safe-area-inset-bottom) + 96px));
    display: flex;
    align-items: flex-end;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,.55);
  }
  #distBlock { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #distPin {
    width: 22px;
    height: 26px;
  }
  #goalLabel {
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(0,0,0,.42);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(8px);
  }

  #distValue {
    color: #ffb04d;
    font-size: 15px;
    font-weight: 800;
  }

  #edgeHint {
    position: absolute;
    z-index: 7;
    top: 43%;
    display: none;
    align-items: center;
    gap: 7px;
    padding: 9px 11px;
    border-radius: 999px;
    background: rgba(0,0,0,.52);
    border: 1px solid rgba(255,255,255,.15);
    color: white;
    font-size: 13px;
    font-weight: 700;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #edgeHint.left { left: 12px; }
  #edgeHint.right { right: 12px; }

  #debug {
    position: absolute;
    left: 14px;
    bottom: 88px;
    z-index: 9;
    display: none;
    padding: 9px 11px;
    border-radius: 12px;
    background: rgba(0,0,0,.52);
    color: white;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    pointer-events: none;
  }

  #controls {
    position: absolute;
    z-index: 10;
    left: 14px;
    right: 14px;
    bottom: max(18px, env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
  }
  button {
    min-height: 48px;
    flex: 1;
    border: 0;
    border-radius: 16px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    background: white;
    color: #111;
  }
  button.secondary {
    flex: 0 1 92px;
    background: rgba(20,20,20,.78);
    color: white;
    border: 1px solid rgba(255,255,255,.17);
  }
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <div id="shade"></div>

  <svg id="routeSvg" aria-hidden="true">
    <defs>
      <!-- 좌(밝은 하늘색) → 우(짙은 네이비) 2톤 셰이딩. 실제 3D가 아니라
           평평한 색상만으로 입체감을 주는 트릭 (레퍼런스와 동일한 방식) -->
      <linearGradient id="routeFill" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"  stop-color="#8fd8ff" stop-opacity=".95"></stop>
        <stop offset="46%" stop-color="#2f8dff" stop-opacity=".95"></stop>
        <stop offset="100%" stop-color="#0b3f9e" stop-opacity=".95"></stop>
      </linearGradient>
    </defs>
    <path id="routeShadow"></path>
    <path id="routeRibbon"></path>
    <path id="routeRim"></path>
  </svg>

  <div id="topStatus">
    <div class="pill" id="gpsStatus">GPS 대기</div>
    <div class="pill" id="versionLabel">v4.5</div>
    <div class="pill" id="headingStatus">방향 대기</div>
  </div>

  <div id="bottomHud">
    <div id="distBlock">
      <div id="goalLabel">목표 1 / 4</div>
      <svg id="distPin" viewBox="0 0 24 28">
        <path d="M12 0C5.4 0 0 5.3 0 11.8 0 20.5 12 28 12 28s12-7.5 12-16.2C24 5.3 18.6 0 12 0z" fill="#ff8a1e"></path>
        <path d="M12 2.6c-5.1 0-9.2 4.1-9.2 9.2 0 6.8 9.2 13.2 9.2 13.2s9.2-6.4 9.2-13.2c0-5.1-4.1-9.2-9.2-9.2z" fill="#ffab52"></path>
      </svg>
      <div id="distValue">-</div>
    </div>
  </div>

  <div id="edgeHint"></div>
  <div id="debug"></div>

  <div id="controls">
    <button id="prevTargetBtn" class="secondary">이전 목표</button>
    <button id="startBtn">카메라 · 위치 · 방향 시작</button>
    <button id="nextTargetBtn" class="secondary">다음 목표</button>
    <button id="debugBtn" class="secondary">정보</button>
  </div>
</div>

<script>
(() => {
  const TARGETS = [
    {
      lat: 37.5653340,
      lon: 126.9788745,
      name: '목표 1',
      guide: '시청삼거리까지 81m 이동(을지로)'
    },
    {
      lat: 37.5658711,
      lon: 126.9793000,
      name: '목표 2',
      guide: '시청삼거리에서 블랙라벨까지 31m 이동'
    },
    {
      lat: 37.5658747,
      lon: 126.9796576,
      name: '목표 3',
      guide: '블랙라벨 앞에서 오른쪽길로 51m 이동'
    },
    {
      lat: 37.5654531,
      lon: 126.9796623,
      name: '목표 4',
      guide: '[B] 도착'
    }
  ];

  const ARRIVAL_RADIUS_M = 5;

  // GPS 보정 설정
  const GPS_MAX_ACCURACY_M = 18;       // 이보다 나쁜 샘플은 기본적으로 무시
  const GPS_HISTORY_SIZE = 6;          // 최근 위치 샘플 수
  const GPS_JUMP_LIMIT_M = 18;         // 비정상 순간 점프 기준
  const GPS_STILL_RADIUS_M = 1.4;      // 정지로 간주할 이동량
  const ARRIVAL_CONFIRM_COUNT = 3;     // 5m 이내 연속 확인 횟수
  const ARRIVAL_RELEASE_M = 8;         // 도착 latch 해제 거리


  // 카메라 실제 FOV를 웹에서 정확히 얻기 어렵기 때문에 일반 후면 광각의
  // 체감값을 사용한다. 화면 밖 목표도 유도선 곡률에는 계속 반영한다.
  const H_FOV = 64;

  const camera = document.getElementById('camera');
  const routeRibbon = document.getElementById('routeRibbon');
  const routeShadow = document.getElementById('routeShadow');
  const routeRim = document.getElementById('routeRim');

  const distValue = document.getElementById('distValue');
  const goalLabel = document.getElementById('goalLabel');
  const edgeHint = document.getElementById('edgeHint');

  const gpsStatus = document.getElementById('gpsStatus');
  const headingStatus = document.getElementById('headingStatus');
  const debug = document.getElementById('debug');
  const startBtn = document.getElementById('startBtn');
  const prevTargetBtn = document.getElementById('prevTargetBtn');
  const nextTargetBtn = document.getElementById('nextTargetBtn');
  const debugBtn = document.getElementById('debugBtn');

  let currentPos = null;
  let targetBearing = null;
  let targetDistance = null;

  let targetIndex = 0;
  let arrivalLatched = false;
  let arrivalConfirmCount = 0;

  // GPS smoothing state
  const gpsHistory = [];
  let filteredPos = null;
  let lastAcceptedRawPos = null;

  // raw sensor state
  let rawHeading = null;

  // filtered state
  let filteredHeading = null;
  let rawPitch = 0;
  let filteredPitch = 7;
  let visualDiff = 0;
  let desiredDiff = 0;
  let alignedLock = false;
  let previousRawDiff = null;

  let rafId = null;
  let started = false;

  function toRad(d){ return d * Math.PI / 180; }
  function toDeg(r){ return r * 180 / Math.PI; }
  function norm360(d){ return (d % 360 + 360) % 360; }
  function norm180(d){ return ((d + 540) % 360) - 180; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function haversine(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dp = toRad(lat2-lat1), dl = toRad(lon2-lon1);
    const a = Math.sin(dp/2)**2 +
      Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function bearing(lat1, lon1, lat2, lon2){
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dl = toRad(lon2-lon1);
    const y = Math.sin(dl)*Math.cos(p2);
    const x = Math.cos(p1)*Math.sin(p2) -
      Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
    return norm360(toDeg(Math.atan2(y,x)));
  }

  function formatDistance(m){
    if(m == null) return '-';
    if(m < 1000) return `${Math.round(m).toLocaleString()}m`;
    return `${(m/1000).toFixed(1)}km`;
  }

  function distanceBetweenPos(a, b){
    if(!a || !b) return Infinity;
    return haversine(a.latitude, a.longitude, b.latitude, b.longitude);
  }

  function addGpsSample(sample){
    // 정확도가 너무 나쁜 샘플은 경로 계산에 사용하지 않는다.
    if(!Number.isFinite(sample.accuracy) || sample.accuracy > GPS_MAX_ACCURACY_M){
      return false;
    }

    // 직전 raw 위치와 비교해 순간적인 큰 점프를 제거.
    if(lastAcceptedRawPos){
      const jump = distanceBetweenPos(lastAcceptedRawPos, sample);

      // accuracy가 특별히 좋은 값이 아닌데 큰 점프가 나면 이상치로 판단.
      if(jump > GPS_JUMP_LIMIT_M && sample.accuracy > 6){
        return false;
      }
    }

    lastAcceptedRawPos = sample;

    gpsHistory.push(sample);
    if(gpsHistory.length > GPS_HISTORY_SIZE){
      gpsHistory.shift();
    }

    // accuracy가 좋은 샘플일수록 더 큰 가중치를 부여.
    let sumW = 0;
    let lat = 0;
    let lon = 0;
    let acc = 0;

    for(const p of gpsHistory){
      const w = 1 / Math.max(1, p.accuracy * p.accuracy);
      sumW += w;
      lat += p.latitude * w;
      lon += p.longitude * w;
      acc += p.accuracy * w;
    }

    const weighted = {
      latitude: lat / sumW,
      longitude: lon / sumW,
      accuracy: acc / sumW
    };

    if(!filteredPos){
      filteredPos = weighted;
    }else{
      const move = distanceBetweenPos(filteredPos, weighted);

      // 정지 상태에서는 GPS가 1~2m 흔들려도 위치를 거의 고정.
      if(move <= GPS_STILL_RADIUS_M){
        const alpha = 0.12;
        filteredPos = {
          latitude: filteredPos.latitude + (weighted.latitude - filteredPos.latitude) * alpha,
          longitude: filteredPos.longitude + (weighted.longitude - filteredPos.longitude) * alpha,
          accuracy: weighted.accuracy
        };
      }else{
        // 실제 이동으로 보일 때는 조금 더 빠르게 따라감.
        const alpha = move > 6 ? 0.55 : 0.32;
        filteredPos = {
          latitude: filteredPos.latitude + (weighted.latitude - filteredPos.latitude) * alpha,
          longitude: filteredPos.longitude + (weighted.longitude - filteredPos.longitude) * alpha,
          accuracy: weighted.accuracy
        };
      }
    }

    currentPos = {
      latitude: filteredPos.latitude,
      longitude: filteredPos.longitude,
      accuracy: filteredPos.accuracy
    };

    return true;
  }

  function getActiveTarget(){
    return TARGETS[targetIndex];
  }

  function updateTargetUi(){
    goalLabel.textContent = `${getActiveTarget().name} / ${TARGETS.length} · ${getActiveTarget().guide}`;
    prevTargetBtn.disabled = targetIndex <= 0;
    nextTargetBtn.disabled = targetIndex >= TARGETS.length - 1;
  }

  function setTargetIndex(nextIndex, reason='manual'){
    const clamped = clamp(nextIndex, 0, TARGETS.length - 1);
    if(clamped === targetIndex) return;

    targetIndex = clamped;
    arrivalLatched = false;
    arrivalConfirmCount = 0;
    alignedLock = false;
    previousRawDiff = null;
    desiredDiff = 0;
    visualDiff = 0;

    updateTargetUi();
    updateTargetFromGps();
  }

  function updateTargetFromGps(){
    if(!currentPos) return;

    const target = getActiveTarget();

    targetBearing = bearing(
      currentPos.latitude, currentPos.longitude,
      target.lat, target.lon
    );

    targetDistance = haversine(
      currentPos.latitude, currentPos.longitude,
      target.lat, target.lon
    );

    distValue.textContent = formatDistance(targetDistance);

    // 5m 안에 "연속으로" 들어온 것이 확인될 때만 다음 목표로 전환.
    // GPS 한 번 튄 값으로 자동 전환되는 것을 방지한다.
    if(targetDistance <= ARRIVAL_RADIUS_M){
      arrivalConfirmCount += 1;

      if(!arrivalLatched && arrivalConfirmCount >= ARRIVAL_CONFIRM_COUNT){
        arrivalLatched = true;

        if(targetIndex < TARGETS.length - 1){
          setTargetIndex(targetIndex + 1, 'arrival');
          return;
        }
      }
    }else{
      arrivalConfirmCount = 0;

      if(targetDistance >= ARRIVAL_RELEASE_M){
        arrivalLatched = false;
      }
    }
  }

  function ingestHeading(newHeading){
    if(!Number.isFinite(newHeading)) return;

    rawHeading = norm360(newHeading);

    if(filteredHeading == null){
      filteredHeading = rawHeading;
      return;
    }

    const delta = norm180(rawHeading-filteredHeading);

    // 정지 상태의 작은 센서 떨림만 제거한다.
    if(Math.abs(delta) < 0.65) return;

    // 회전 중에는 지연이 생기지 않도록 훨씬 빠르게 따라간다.
    const alpha =
      Math.abs(delta) > 35 ? 0.48 :
      Math.abs(delta) > 18 ? 0.38 :
      Math.abs(delta) > 8  ? 0.28 :
      Math.abs(delta) > 3  ? 0.18 :
                             0.10;

    filteredHeading = norm360(filteredHeading + delta*alpha);
  }

  function handleOrientation(e){
    let h = null;

    if(typeof e.webkitCompassHeading === 'number'){
      h = e.webkitCompassHeading;
    }else if(typeof e.alpha === 'number'){
      const screenAngle =
        (screen.orientation && typeof screen.orientation.angle === 'number')
          ? screen.orientation.angle
          : (typeof window.orientation === 'number' ? window.orientation : 0);
      h = norm360(360 - e.alpha + screenAngle);
    }

    if(h != null) ingestHeading(h);

    if(typeof e.beta === 'number'){
      rawPitch = clamp(90 - e.beta, -25, 45);
      const pd = rawPitch - filteredPitch;
      filteredPitch += pd * (Math.abs(pd) > 8 ? 0.16 : 0.07);
    }
  }

  // 실제 3D 지면 좌표계에서 경로를 만든 뒤 카메라 화면으로 투영한다.
  // 별도의 화살표 머리/네크 조각을 붙이지 않고, 폭 보간만으로 표현한다.
  function buildRoute(diff){
    const W = window.innerWidth;
    const H = window.innerHeight;

    const CAMERA_HEIGHT_M = 1.55;
    const hFov = toRad(H_FOV);
    const vFov = 2 * Math.atan(Math.tan(hFov/2) * (H/W));
    const fx = (W/2) / Math.tan(hFov/2);
    const fy = (H/2) / Math.tan(vFov/2);
    const cx = W/2;
    const cy = H/2;
    const pitch = toRad(clamp(filteredPitch, -18, 32));

    function projectGround(x,z){
      const y = -CAMERA_HEIGHT_M;
      const yc = y*Math.cos(pitch) + z*Math.sin(pitch);
      const zc = -y*Math.sin(pitch) + z*Math.cos(pitch);
      if(zc <= 0.35) return null;
      return {x:cx + fx*(x/zc), y:cy - fy*(yc/zc), depth:zc};
    }

    const theta = toRad(clamp(diff,-179.5,179.5));
    const absTheta = Math.abs(theta);
    const PATH_LENGTH_M = absTheta < toRad(35) ? 16 : absTheta < toRad(90) ? 14 : 12;
    const samples = 140;
    const centerWorld = [];

    for(let i=0;i<=samples;i++){
      const s = PATH_LENGTH_M*(i/samples);
      let x,z;
      if(absTheta < 1e-4){
        x=0; z=s;
      }else{
        const k = theta/PATH_LENGTH_M;
        x = (1-Math.cos(k*s))/k;
        z = Math.sin(k*s)/k;
      }
      centerWorld.push({x,z,s});
    }

    const ROUTE_WIDTH_M = 1.25;
    const leftScreen=[], rightScreen=[];
    let visibleStarted=false;

    for(let i=0;i<centerWorld.length;i++){
      const p=centerWorld[i];
      const prev=centerWorld[Math.max(0,i-1)];
      const next=centerWorld[Math.min(centerWorld.length-1,i+1)];
      const tx=next.x-prev.x, tz=next.z-prev.z;
      const tlen=Math.hypot(tx,tz)||1;
      const nx=-tz/tlen, nz=tx/tlen;
      const u=i/(centerWorld.length-1);
      let widthScale=1;
      if(u>0.86) widthScale=Math.max(0,1-(u-0.86)/0.14);
      const half=ROUTE_WIDTH_M*widthScale/2;

      const c=projectGround(p.x,p.z);
      const l=projectGround(p.x+nx*half,p.z+nz*half);
      const r=projectGround(p.x-nx*half,p.z-nz*half);
      const valid=c&&l&&r;
      if(valid){
        visibleStarted=true;
        leftScreen.push(l); rightScreen.push(r);
      }else if(visibleStarted){
        break;
      }
    }

    if(leftScreen.length<2) return {ribbonD:'',rimD:'',visibleCount:0};

    let ribbonD=`M ${leftScreen[0].x} ${leftScreen[0].y}`;
    for(let i=1;i<leftScreen.length;i++) ribbonD+=` L ${leftScreen[i].x} ${leftScreen[i].y}`;
    for(let i=rightScreen.length-1;i>=0;i--) ribbonD+=` L ${rightScreen[i].x} ${rightScreen[i].y}`;
    ribbonD+=' Z';

    let rimD=`M ${leftScreen[0].x} ${leftScreen[0].y}`;
    for(let i=1;i<leftScreen.length;i++) rimD+=` L ${leftScreen[i].x} ${leftScreen[i].y}`;

    return {ribbonD,rimD,visibleCount:leftScreen.length};
  }

  function renderRoute(){
    if(targetBearing != null && rawHeading != null){
      const rawDiff = norm180(targetBearing-rawHeading);

      if(!alignedLock && Math.abs(rawDiff) <= 4){
        alignedLock = true;
      }else if(alignedLock && Math.abs(rawDiff) >= 7){
        alignedLock = false;
      }

      const crossedTarget =
        previousRawDiff != null &&
        Math.sign(previousRawDiff) !== Math.sign(rawDiff) &&
        Math.abs(rawDiff) < 12 &&
        Math.abs(previousRawDiff) < 12;

      previousRawDiff = rawDiff;

      if(alignedLock || crossedTarget){
        desiredDiff = 0;
        visualDiff *= 0.35;
      }else if(filteredHeading != null){
        desiredDiff = norm180(targetBearing-filteredHeading);
      }
    }

    const delta = norm180(desiredDiff-visualDiff);
    const visualAlpha =
      Math.abs(delta) > 70 ? 0.30 :
      Math.abs(delta) > 35 ? 0.23 :
      Math.abs(delta) > 15 ? 0.17 :
      Math.abs(delta) > 6  ? 0.12 :
                             0.075;

    if(Math.abs(delta) < 0.45){
      visualDiff = desiredDiff;
    }else{
      visualDiff += delta*visualAlpha;
    }

    if(alignedLock && Math.abs(visualDiff) < 1.2){
      visualDiff = 0;
    }

    const route = buildRoute(visualDiff);
    routeRibbon.setAttribute('d',route.ribbonD);
    routeShadow.setAttribute('d',route.ribbonD);
    routeRim.setAttribute('d',route.rimD);

    const halfFov = H_FOV/2;
    const onScreen = Math.abs(visualDiff) <= halfFov;

    if(onScreen){
      edgeHint.style.display = 'none';
    }else{
      edgeHint.style.display = 'flex';
      if(visualDiff < 0){
        edgeHint.className = 'left';
        edgeHint.textContent = `← ${formatDistance(targetDistance)}`;
      }else{
        edgeHint.className = 'right';
        edgeHint.textContent = `${formatDistance(targetDistance)} →`;
      }
    }

    if(filteredHeading != null){
      headingStatus.textContent = `방향 ${Math.round(filteredHeading)}°`;
    }

    debug.textContent =
`목표: ${getActiveTarget().name} (${getActiveTarget().lat}, ${getActiveTarget().lon})
현재: ${currentPos ? currentPos.latitude.toFixed(7)+', '+currentPos.longitude.toFixed(7) : '-'}
거리: ${targetDistance != null ? targetDistance.toFixed(1)+' m' : '-'}
GPS 보정 accuracy: ${currentPos ? currentPos.accuracy.toFixed(1)+' m' : '-'}
도착 확인: ${arrivalConfirmCount}/${ARRIVAL_CONFIRM_COUNT}
목표 방위각: ${targetBearing != null ? targetBearing.toFixed(1)+'°' : '-'}
필터 헤딩: ${filteredHeading != null ? filteredHeading.toFixed(1)+'°' : '-'}
카메라 피치: ${filteredPitch.toFixed(1)}°
방향 차이: ${visualDiff.toFixed(1)}°`;

    rafId = requestAnimationFrame(renderRoute);
  }

  async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    camera.srcObject = stream;
  }

  function startGPS(){
    if(!navigator.geolocation){
      gpsStatus.textContent = 'GPS 미지원';
      return;
    }

    navigator.geolocation.watchPosition(pos=>{
      const sample = {
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        timestamp: pos.timestamp || Date.now()
      };

      const accepted = addGpsSample(sample);

      if(accepted){
        gpsStatus.textContent =
          `GPS ±${Math.round(currentPos.accuracy)}m · 보정`;
        updateTargetFromGps();
      }else{
        gpsStatus.textContent =
          `GPS ±${Math.round(pos.coords.accuracy)}m · 대기`;
      }
    },err=>{
      gpsStatus.textContent = 'GPS 오류';
      console.error(err);
    },{
      enableHighAccuracy:true,
      maximumAge:400,
      timeout:15000
    });
  }

  async function startOrientation(){
    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      const result = await DeviceOrientationEvent.requestPermission();
      if(result !== 'granted') throw new Error('방향 센서 권한 거부');
    }

    if('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute',handleOrientation,true);
    }else{
      window.addEventListener('deviceorientation',handleOrientation,true);
    }
  }

  startBtn.addEventListener('click',async()=>{
    if(started) return;

    startBtn.disabled = true;
    startBtn.textContent = '시작 중…';

    try{
      await startCamera();
      startGPS();
      await startOrientation();

      started = true;
      startBtn.textContent = '실행 중';

      if(!rafId) rafId = requestAnimationFrame(renderRoute);
    }catch(err){
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = '권한 확인 후 다시 시작';
      alert('카메라·위치·방향 센서 권한을 허용해주세요. HTTPS 환경에서 실행해주세요.');
    }
  });

  prevTargetBtn.addEventListener('click',()=>{
    setTargetIndex(targetIndex - 1, 'manual');
  });

  nextTargetBtn.addEventListener('click',()=>{
    setTargetIndex(targetIndex + 1, 'manual');
  });

  debugBtn.addEventListener('click',()=>{
    debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
  });

  window.addEventListener('resize',()=>{
    if(!rafId) renderRoute();
  });

  // 권한 전에도 레이아웃 형태는 보이도록 초기 렌더.
  routeRibbon.setAttribute('d','');
  routeShadow.setAttribute('d','');
  routeRim.setAttribute('d','');
  updateTargetUi();
})();
</script>
</body>
</html>
