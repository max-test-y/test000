<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AR Navigation v3.0</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  #shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,.34) 0%,
        rgba(0,0,0,.05) 18%,
        rgba(0,0,0,0) 48%,
        rgba(0,0,0,.08) 72%,
        rgba(0,0,0,.34) 100%);
  }

  #routeSvg {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  #routeShadow {
    fill: rgba(0,0,0,.22);
    filter: blur(4px);
  }
  #routeRibbon {
    fill: url(#routeFill);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.22));
  }
  #routeRim {
    fill: none;
    stroke: rgba(220,242,255,.55);
    stroke-width: 2;
    stroke-linecap: round;
  }

  #topStatus {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 14px;
    right: 14px;
    z-index: 8;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .pill {
    width: max-content;
    max-width: 100%;
    padding: 8px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.48);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
  }
  #versionLabel { justify-self: center; }
  #headingStatus { justify-self: end; }

  /* 하단 HUD: 속도 + 오렌지 핀 + 거리 (레퍼런스 스타일) */
  #bottomHud {
    position: absolute;
    z-index: 9;
    left: 18px;
    bottom: max(96px, calc(env(safe-area-inset-bottom) + 96px));
    display: flex;
    align-items: flex-end;
    gap: 14px;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,.55);
  }
  #speedValue {
    color: #fff;
    font-size: 44px;
    font-weight: 800;
    line-height: .82;
    letter-spacing: -.5px;
  }
  #speedUnit {
    color: rgba(255,255,255,.85);
    font-size: 13px;
    font-weight: 700;
    margin-top: 2px;
  }
  #speedBlock { display: flex; flex-direction: column; align-items: flex-start; }
  #distBlock { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #distPin {
    width: 22px;
    height: 26px;
  }
  #distValue {
    color: #ffb04d;
    font-size: 15px;
    font-weight: 800;
  }

  #edgeHint {
    position: absolute;
    z-index: 7;
    top: 43%;
    display: none;
    align-items: center;
    gap: 7px;
    padding: 9px 11px;
    border-radius: 999px;
    background: rgba(0,0,0,.52);
    border: 1px solid rgba(255,255,255,.15);
    color: white;
    font-size: 13px;
    font-weight: 700;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #edgeHint.left { left: 12px; }
  #edgeHint.right { right: 12px; }

  #debug {
    position: absolute;
    left: 14px;
    bottom: 88px;
    z-index: 9;
    display: none;
    padding: 9px 11px;
    border-radius: 12px;
    background: rgba(0,0,0,.52);
    color: white;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    pointer-events: none;
  }

  #controls {
    position: absolute;
    z-index: 10;
    left: 14px;
    right: 14px;
    bottom: max(18px, env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
  }
  button {
    min-height: 48px;
    flex: 1;
    border: 0;
    border-radius: 16px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    background: white;
    color: #111;
  }
  button.secondary {
    flex: 0 0 82px;
    background: rgba(20,20,20,.78);
    color: white;
    border: 1px solid rgba(255,255,255,.17);
  }
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <div id="shade"></div>

  <svg id="routeSvg" aria-hidden="true">
    <defs>
      <!-- 좌(밝은 하늘색) → 우(짙은 네이비) 2톤 셰이딩. 실제 3D가 아니라
           평평한 색상만으로 입체감을 주는 트릭 (레퍼런스와 동일한 방식) -->
      <linearGradient id="routeFill" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"  stop-color="#8fd8ff" stop-opacity=".95"></stop>
        <stop offset="46%" stop-color="#2f8dff" stop-opacity=".95"></stop>
        <stop offset="100%" stop-color="#0b3f9e" stop-opacity=".95"></stop>
      </linearGradient>
    </defs>
    <path id="routeShadow"></path>
    <path id="routeRibbon"></path>
    <path id="routeRim"></path>
  </svg>

  <div id="topStatus">
    <div class="pill" id="gpsStatus">GPS 대기</div>
    <div class="pill" id="versionLabel">v3.0</div>
    <div class="pill" id="headingStatus">방향 대기</div>
  </div>

  <div id="bottomHud">
    <div id="speedBlock">
      <div id="speedValue">--</div>
      <div id="speedUnit">km/h</div>
    </div>
    <div id="distBlock">
      <svg id="distPin" viewBox="0 0 24 28">
        <path d="M12 0C5.4 0 0 5.3 0 11.8 0 20.5 12 28 12 28s12-7.5 12-16.2C24 5.3 18.6 0 12 0z" fill="#ff8a1e"></path>
        <path d="M12 2.6c-5.1 0-9.2 4.1-9.2 9.2 0 6.8 9.2 13.2 9.2 13.2s9.2-6.4 9.2-13.2c0-5.1-4.1-9.2-9.2-9.2z" fill="#ffab52"></path>
      </svg>
      <div id="distValue">-</div>
    </div>
  </div>

  <div id="edgeHint"></div>
  <div id="debug"></div>

  <div id="controls">
    <button id="startBtn">카메라 · 위치 · 방향 시작</button>
    <button id="debugBtn" class="secondary">정보</button>
  </div>
</div>

<script>
(() => {
  const TARGET = { lat: 37.5668260, lon: 126.9786567 };

  // 카메라 실제 FOV를 웹에서 정확히 얻기 어렵기 때문에 일반 후면 광각의
  // 체감값을 사용한다. 화면 밖 목표도 유도선 곡률에는 계속 반영한다.
  const H_FOV = 64;

  const camera = document.getElementById('camera');
  const routeRibbon = document.getElementById('routeRibbon');
  const routeShadow = document.getElementById('routeShadow');
  const routeRim = document.getElementById('routeRim');

  const speedValue = document.getElementById('speedValue');
  const distValue = document.getElementById('distValue');
  const edgeHint = document.getElementById('edgeHint');

  const gpsStatus = document.getElementById('gpsStatus');
  const headingStatus = document.getElementById('headingStatus');
  const debug = document.getElementById('debug');
  const startBtn = document.getElementById('startBtn');
  const debugBtn = document.getElementById('debugBtn');

  let currentPos = null;
  let currentSpeed = null; // m/s, GPS가 제공할 때만
  let targetBearing = null;
  let targetDistance = null;

  // raw sensor state
  let rawHeading = null;

  // filtered state
  let filteredHeading = null;
  let visualDiff = 0;
  let desiredDiff = 0;
  let alignedLock = false;
  let previousRawDiff = null;

  let rafId = null;
  let started = false;

  function toRad(d){ return d * Math.PI / 180; }
  function toDeg(r){ return r * 180 / Math.PI; }
  function norm360(d){ return (d % 360 + 360) % 360; }
  function norm180(d){ return ((d + 540) % 360) - 180; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function haversine(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dp = toRad(lat2-lat1), dl = toRad(lon2-lon1);
    const a = Math.sin(dp/2)**2 +
      Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function bearing(lat1, lon1, lat2, lon2){
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dl = toRad(lon2-lon1);
    const y = Math.sin(dl)*Math.cos(p2);
    const x = Math.cos(p1)*Math.sin(p2) -
      Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
    return norm360(toDeg(Math.atan2(y,x)));
  }

  function formatDistance(m){
    if(m == null) return '-';
    if(m < 1000) return `${Math.round(m).toLocaleString()}m`;
    return `${(m/1000).toFixed(1)}km`;
  }

  function updateTargetFromGps(){
    if(!currentPos) return;

    targetBearing = bearing(
      currentPos.latitude, currentPos.longitude,
      TARGET.lat, TARGET.lon
    );

    targetDistance = haversine(
      currentPos.latitude, currentPos.longitude,
      TARGET.lat, TARGET.lon
    );

    distValue.textContent = formatDistance(targetDistance);
  }

  function ingestHeading(newHeading){
    if(!Number.isFinite(newHeading)) return;

    rawHeading = norm360(newHeading);

    if(filteredHeading == null){
      filteredHeading = rawHeading;
      return;
    }

    const delta = norm180(rawHeading-filteredHeading);

    // 정지 상태의 작은 센서 떨림만 제거한다.
    if(Math.abs(delta) < 0.65) return;

    // 회전 중에는 지연이 생기지 않도록 훨씬 빠르게 따라간다.
    const alpha =
      Math.abs(delta) > 35 ? 0.48 :
      Math.abs(delta) > 18 ? 0.38 :
      Math.abs(delta) > 8  ? 0.28 :
      Math.abs(delta) > 3  ? 0.18 :
                             0.10;

    filteredHeading = norm360(filteredHeading + delta*alpha);
  }

  function handleOrientation(e){
    let h = null;

    if(typeof e.webkitCompassHeading === 'number'){
      h = e.webkitCompassHeading;
    }else if(typeof e.alpha === 'number'){
      const screenAngle =
        (screen.orientation && typeof screen.orientation.angle === 'number')
          ? screen.orientation.angle
          : (typeof window.orientation === 'number' ? window.orientation : 0);

      h = norm360(360 - e.alpha + screenAngle);
    }

    if(h != null) ingestHeading(h);
  }

  // 레퍼런스처럼 리본 하나가 화살촉처럼 끝까지 뾰족하게 이어지는 형태.
  // 별도의 화살표 머리/네크 조각을 붙이지 않고, 폭 보간만으로 표현한다.
  function buildRoute(diff){
    const W = window.innerWidth;
    const H = window.innerHeight;

    const start = { x:W*0.50, y:H+150 };
    const absDeg = Math.min(180, Math.abs(diff));
    const sign = diff >= 0 ? 1 : -1;

    const halfFov = H_FOV/2;
    const visibleRatio = clamp(diff/halfFov,-1.25,1.25);
    const forwardEnd = {
      x: W*0.50 + visibleRatio*(W*0.35),
      y: H*0.50
    };

    const pts = [];

    function addCubic(p0,p1,p2,p3,steps,skipFirst=false){
      for(let i=skipFirst ? 1 : 0;i<=steps;i++){
        const t=i/steps, mt=1-t;
        pts.push({
          x: mt*mt*mt*p0.x + 3*mt*mt*t*p1.x + 3*mt*t*t*p2.x + t*t*t*p3.x,
          y: mt*mt*mt*p0.y + 3*mt*mt*t*p1.y + 3*mt*t*t*p2.y + t*t*t*p3.y
        });
      }
    }

    function addArc(cx,cy,r,a0,a1,steps,skipFirst=true){
      for(let i=skipFirst ? 1 : 0;i<=steps;i++){
        const t=i/steps;
        const a=a0+(a1-a0)*t;
        pts.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});
      }
    }

    if(absDeg <= 90){
      let curve;
      if(absDeg <= 8){
        curve=0;
      }else if(absDeg <= 25){
        curve=0.04+0.14*Math.pow((absDeg-8)/17,1.35);
      }else if(absDeg <= 45){
        curve=0.18+0.20*Math.pow((absDeg-25)/20,1.25);
      }else{
        curve=0.38+0.42*Math.pow((absDeg-45)/45,1.05);
      }

      const c1={
        x:start.x+sign*W*(0.008+0.035*curve),
        y:H*0.76
      };
      const c2={
        x:forwardEnd.x-sign*W*(0.05+0.62*curve),
        y:H*(0.59-0.07*curve)
      };

      addCubic(start,c1,c2,forwardEnd,72);

    } else {
      const u = (absDeg-90)/90;

      const approachEnd = {
        x: start.x,
        y: H*0.66
      };

      addCubic(
        start,
        {x:start.x,y:H*0.88},
        {x:start.x,y:H*0.74},
        approachEnd,
        26
      );

      const radius = W*(0.18 + 0.10*u);
      const cx = approachEnd.x + sign*radius;
      const cy = approachEnd.y;

      const sweep = Math.PI/2 + (Math.PI/2)*u;

      let a0, a1;
      if(sign > 0){
        a0 = Math.PI;
        a1 = Math.PI - sweep;
      }else{
        a0 = 0;
        a1 = sweep;
      }

      addArc(cx,cy,radius,a0,a1,34,true);

      const last = pts[pts.length-1];
      const returnAmount = u;
      const returnEnd = {
        x: last.x,
        y: lerp(last.y, H*0.78, returnAmount)
      };

      if(returnAmount > 0.05){
        const prev = pts[pts.length-2];
        const tx = last.x-prev.x;
        const ty = last.y-prev.y;
        const len = Math.hypot(tx,ty)||1;
        const ux=tx/len, uy=ty/len;

        addCubic(
          last,
          {x:last.x+ux*H*0.035,y:last.y+uy*H*0.035},
          {x:returnEnd.x,y:returnEnd.y-H*0.035},
          returnEnd,
          18,
          true
        );
      }
    }

    // 누적 거리
    const lengths=[0];
    let total=0;
    for(let i=1;i<pts.length;i++){
      total+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
      lengths.push(total);
    }
    total ||= 1;

    // 레퍼런스 대비: 근거리 폭을 더 두툼하게, 원거리는 뾰족한 점(farWidth≈0)까지
    // 좁아지도록 해서 "짧고 두꺼운 화살표" ~ "길게 휘어지는 뾰족한 리본" 두 느낌을
    // 하나의 보간식으로 표현한다.
    const left=[],right=[];
    for(let i=0;i<pts.length;i++){
      const prev=pts[Math.max(0,i-1)];
      const next=pts[Math.min(pts.length-1,i+1)];
      const dx=next.x-prev.x, dy=next.y-prev.y;
      const len=Math.hypot(dx,dy)||1;
      const nx=-dy/len, ny=dx/len;

      const t=lengths[i]/total;
      const perspective=1-Math.pow(1-t,3.4);
      const nearWidth=Math.min(W*0.38,168);
      const farWidth=3;
      const width=lerp(nearWidth,farWidth,perspective);
      const half=width/2;

      left.push({x:pts[i].x+nx*half,y:pts[i].y+ny*half});
      right.push({x:pts[i].x-nx*half,y:pts[i].y-ny*half});
    }

    let ribbonD=`M ${left[0].x} ${left[0].y}`;
    for(let i=1;i<left.length;i++) ribbonD+=` L ${left[i].x} ${left[i].y}`;
    for(let i=right.length-1;i>=0;i--) ribbonD+=` L ${right[i].x} ${right[i].y}`;
    ribbonD+=' Z';

    // 밝은(안쪽) 가장자리를 따라가는 얇은 림 라이트 — 레퍼런스의 은은한
    // 하이라이트 엣지를 흉내낸다.
    let rimD=`M ${left[0].x} ${left[0].y}`;
    for(let i=1;i<left.length;i++) rimD+=` L ${left[i].x} ${left[i].y}`;

    return {ribbonD, rimD};
  }

  function renderRoute(){
    if(targetBearing != null && rawHeading != null){
      const rawDiff = norm180(targetBearing-rawHeading);

      if(!alignedLock && Math.abs(rawDiff) <= 4){
        alignedLock = true;
      }else if(alignedLock && Math.abs(rawDiff) >= 7){
        alignedLock = false;
      }

      const crossedTarget =
        previousRawDiff != null &&
        Math.sign(previousRawDiff) !== Math.sign(rawDiff) &&
        Math.abs(rawDiff) < 12 &&
        Math.abs(previousRawDiff) < 12;

      previousRawDiff = rawDiff;

      if(alignedLock || crossedTarget){
        desiredDiff = 0;
        visualDiff *= 0.35;
      }else if(filteredHeading != null){
        desiredDiff = norm180(targetBearing-filteredHeading);
      }
    }

    const delta = norm180(desiredDiff-visualDiff);
    const visualAlpha =
      Math.abs(delta) > 70 ? 0.30 :
      Math.abs(delta) > 35 ? 0.23 :
      Math.abs(delta) > 15 ? 0.17 :
      Math.abs(delta) > 6  ? 0.12 :
                             0.075;

    if(Math.abs(delta) < 0.45){
      visualDiff = desiredDiff;
    }else{
      visualDiff += delta*visualAlpha;
    }

    if(alignedLock && Math.abs(visualDiff) < 1.2){
      visualDiff = 0;
    }

    const route = buildRoute(visualDiff);
    routeRibbon.setAttribute('d',route.ribbonD);
    routeShadow.setAttribute('d',route.ribbonD);
    routeRim.setAttribute('d',route.rimD);

    const halfFov = H_FOV/2;
    const onScreen = Math.abs(visualDiff) <= halfFov;

    if(onScreen){
      edgeHint.style.display = 'none';
    }else{
      edgeHint.style.display = 'flex';
      if(visualDiff < 0){
        edgeHint.className = 'left';
        edgeHint.textContent = `← ${formatDistance(targetDistance)}`;
      }else{
        edgeHint.className = 'right';
        edgeHint.textContent = `${formatDistance(targetDistance)} →`;
      }
    }

    if(filteredHeading != null){
      headingStatus.textContent = `방향 ${Math.round(filteredHeading)}°`;
    }

    if(currentSpeed != null){
      speedValue.textContent = `${Math.round(currentSpeed*3.6)}`;
    }

    debug.textContent =
`목표: ${TARGET.lat}, ${TARGET.lon}
현재: ${currentPos ? currentPos.latitude.toFixed(7)+', '+currentPos.longitude.toFixed(7) : '-'}
거리: ${targetDistance != null ? targetDistance.toFixed(1)+' m' : '-'}
목표 방위각: ${targetBearing != null ? targetBearing.toFixed(1)+'°' : '-'}
필터 헤딩: ${filteredHeading != null ? filteredHeading.toFixed(1)+'°' : '-'}
방향 차이: ${visualDiff.toFixed(1)}°`;

    rafId = requestAnimationFrame(renderRoute);
  }

  async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    camera.srcObject = stream;
  }

  function startGPS(){
    if(!navigator.geolocation){
      gpsStatus.textContent = 'GPS 미지원';
      return;
    }

    navigator.geolocation.watchPosition(pos=>{
      currentPos = {
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy
      };
      currentSpeed = (typeof pos.coords.speed === 'number' && pos.coords.speed >= 0)
        ? pos.coords.speed
        : null;

      gpsStatus.textContent = `GPS ±${Math.round(pos.coords.accuracy)}m`;
      updateTargetFromGps();
    },err=>{
      gpsStatus.textContent = 'GPS 오류';
      console.error(err);
    },{
      enableHighAccuracy:true,
      maximumAge:400,
      timeout:15000
    });
  }

  async function startOrientation(){
    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      const result = await DeviceOrientationEvent.requestPermission();
      if(result !== 'granted') throw new Error('방향 센서 권한 거부');
    }

    if('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute',handleOrientation,true);
    }else{
      window.addEventListener('deviceorientation',handleOrientation,true);
    }
  }

  startBtn.addEventListener('click',async()=>{
    if(started) return;

    startBtn.disabled = true;
    startBtn.textContent = '시작 중…';

    try{
      await startCamera();
      startGPS();
      await startOrientation();

      started = true;
      startBtn.textContent = '실행 중';

      if(!rafId) rafId = requestAnimationFrame(renderRoute);
    }catch(err){
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = '권한 확인 후 다시 시작';
      alert('카메라·위치·방향 센서 권한을 허용해주세요. HTTPS 환경에서 실행해주세요.');
    }
  });

  debugBtn.addEventListener('click',()=>{
    debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
  });

  window.addEventListener('resize',()=>{
    if(!rafId) renderRoute();
  });

  // 권한 전에도 레이아웃 형태는 보이도록 초기 렌더.
  routeRibbon.setAttribute('d','');
  routeShadow.setAttribute('d','');
  routeRim.setAttribute('d','');
})();
</script>
</body>
</html>
