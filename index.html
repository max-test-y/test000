<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AR Direction Pointer</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #app{position:relative;width:100%;height:100%;background:#000}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.34),transparent 20%,transparent 72%,rgba(0,0,0,.35))}
  #status{
    position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;
    display:flex;justify-content:space-between;gap:8px;z-index:5;pointer-events:none
  }
  #versionLabel{
    position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;
    transform:translateX(-50%);z-index:7;pointer-events:none;
    padding:8px 10px;border-radius:999px;
    background:rgba(0,0,0,.48);backdrop-filter:blur(10px);
    color:#fff;font-size:12px;line-height:1;
    border:1px solid rgba(255,255,255,.14)
  }
  .pill{background:rgba(0,0,0,.48);backdrop-filter:blur(10px);padding:8px 10px;border-radius:999px;font-size:12px;line-height:1;color:#fff;border:1px solid rgba(255,255,255,.14)}

  #guideLine{
    position:absolute;inset:0;width:100%;height:100%;z-index:3;
    pointer-events:none;overflow:visible
  }
  #guideRibbon{
    fill:url(#routeGradient);
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.20));
  }
  #guideHighlight{
    fill:none;
    stroke:rgba(255,255,255,.20);
    stroke-width:2;
    stroke-linecap:round;
    pointer-events:none;
  }

  #arrowWrap{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:left .12s linear,top .12s linear,opacity .12s linear
  }
  #arrow{
    width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;
    border-bottom:46px solid white;filter:drop-shadow(0 3px 8px rgba(0,0,0,.65))
  }
  #label{
    padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.54);
    color:white;font-weight:700;font-size:14px;white-space:nowrap;border:1px solid rgba(255,255,255,.16)
  }
  #edge{
    position:absolute;top:50%;z-index:4;display:none;align-items:center;gap:8px;
    background:rgba(0,0,0,.56);color:#fff;border:1px solid rgba(255,255,255,.16);
    border-radius:999px;padding:10px 13px;font-weight:700;transform:translateY(-50%);
    backdrop-filter:blur(10px);pointer-events:none
  }
  #edge.left{left:12px}
  #edge.right{right:12px}
  #controls{
    position:absolute;left:14px;right:14px;bottom:max(18px,env(safe-area-inset-bottom));
    z-index:6;display:flex;gap:10px
  }
  button{
    flex:1;appearance:none;border:0;border-radius:16px;padding:14px 12px;
    font-size:15px;font-weight:700;background:#fff;color:#111
  }
  button.secondary{background:rgba(20,20,20,.76);color:#fff;border:1px solid rgba(255,255,255,.18)}
  #debug{
    position:absolute;left:14px;bottom:86px;z-index:5;
    color:#fff;font-size:11px;line-height:1.5;background:rgba(0,0,0,.45);
    padding:8px 10px;border-radius:12px;display:none;white-space:pre-wrap
  }
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <div id="shade"></div>

  <svg id="guideLine" aria-hidden="true">
    <defs>
      <linearGradient id="routeGradient" x1="0" y1="1" x2="0" y2="0">
        <stop id="routeStopNear" offset="0%" stop-color="#075BFF" stop-opacity=".62"></stop>
        <stop id="routeStopFar" offset="100%" stop-color="#075BFF" stop-opacity=".42"></stop>
      </linearGradient>
    </defs>
    <path id="guideRibbon" d=""></path>
    <path id="guideHighlight" d=""></path>
  </svg>

  <div id="versionLabel">v1.5</div>

  <div id="status">
    <div class="pill" id="gpsStatus">GPS 대기</div>
    <div class="pill" id="headingStatus">방향 대기</div>
  </div>

  <div id="arrowWrap" aria-label="목표 방향">
    <div id="arrow"></div>
    <div id="label">목표 위치</div>
  </div>

  <div id="edge"></div>
  <div id="debug"></div>

  <div id="controls">
    <button id="startBtn">카메라 · 위치 · 방향 시작</button>
    <button id="debugBtn" class="secondary">정보</button>
  </div>
</div>

<script>
(() => {
  const TARGET = { lat: 37.566826, lon: 126.9786567 };

  const video = document.getElementById('camera');
  const startBtn = document.getElementById('startBtn');
  const debugBtn = document.getElementById('debugBtn');
  const arrowWrap = document.getElementById('arrowWrap');
  const guideRibbon = document.getElementById('guideRibbon');
  const guideHighlight = document.getElementById('guideHighlight');
  const routeStopNear = document.getElementById('routeStopNear');
  const routeStopFar = document.getElementById('routeStopFar');
  const label = document.getElementById('label');
  const edge = document.getElementById('edge');
  const gpsStatus = document.getElementById('gpsStatus');
  const headingStatus = document.getElementById('headingStatus');
  const debug = document.getElementById('debug');

  let currentPos = null;
  let currentHeading = null;
  let targetBearing = null;
  let targetDistance = null;
  let lastHeading = null;

  const H_FOV = 60;

  function toRad(d){ return d * Math.PI / 180; }
  function toDeg(r){ return r * 180 / Math.PI; }
  function norm360(d){ return (d % 360 + 360) % 360; }
  function norm180(d){ return ((d + 540) % 360) - 180; }

  function haversine(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dp = toRad(lat2-lat1), dl = toRad(lon2-lon1);
    const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function bearing(lat1, lon1, lat2, lon2){
    const p1 = toRad(lat1), p2 = toRad(lat2), dl = toRad(lon2-lon1);
    const y = Math.sin(dl) * Math.cos(p2);
    const x = Math.cos(p1)*Math.sin(p2) - Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
    return norm360(toDeg(Math.atan2(y, x)));
  }

  function smoothHeading(newH){
    if (lastHeading == null) {
      lastHeading = newH;
      return newH;
    }
    const diff = norm180(newH - lastHeading);
    lastHeading = norm360(lastHeading + diff * 0.18);
    return lastHeading;
  }

  function updateTarget(){
    if(!currentPos) return;
    targetBearing = bearing(
      currentPos.latitude, currentPos.longitude,
      TARGET.lat, TARGET.lon
    );
    targetDistance = haversine(
      currentPos.latitude, currentPos.longitude,
      TARGET.lat, TARGET.lon
    );
    render();
  }

  function setGuideRibbonEnd(x, y, angleDiff = 0){
    const W = window.innerWidth;
    const H = window.innerHeight;

    // 화면 하단 "아래"에서부터 경로가 솟아오르게 해
    // 실제 바닥 평면에 놓여 카메라 원근으로 보이는 느낌을 만든다.
    const startX = W / 2;
    const startY = H + 105;

    // 목표 화살표 밑쪽으로 연결.
    const endX = x;
    const endY = y + 46;

    // 가까운 쪽은 넓고, 먼 쪽은 매우 좁게.
    const startWidth = Math.min(220, W * 0.48);
    const endWidth = 18;

    const signed = Math.max(-1, Math.min(1, angleDiff / 48));
    const severity = Math.min(1, Math.abs(angleDiff) / 32);
    const spanY = Math.max(220, startY - endY);

    // 곡률은 각도에 선형으로 반응하지 않고 easing을 사용.
    // 작은 오차에서는 거의 직진, 큰 오차에서 점진적으로 휘어진다.
    const easedCurve = Math.sign(signed) * Math.pow(Math.abs(signed), 1.45);

    // 시작부는 진행 방향을 거의 화면 중앙으로 유지해
    // 발밑에 놓인 경로처럼 보이게 한다.
    const c1x = startX + easedCurve * W * 0.018;
    const c1y = startY - spanY * 0.37;

    // 중후반부에서만 목표 쪽으로 유도.
    // 과도한 활 모양 대신 자연스러운 도로 곡선을 만든다.
    const c2x = endX - easedCurve * W * 0.12;
    const c2y = endY + spanY * 0.38;

    function bezierPoint(t){
      const mt = 1 - t;
      return {
        x:
          mt*mt*mt*startX +
          3*mt*mt*t*c1x +
          3*mt*t*t*c2x +
          t*t*t*endX,
        y:
          mt*mt*mt*startY +
          3*mt*mt*t*c1y +
          3*mt*t*t*c2y +
          t*t*t*endY
      };
    }

    function bezierTangent(t){
      const mt = 1 - t;
      const dx =
        3*mt*mt*(c1x-startX) +
        6*mt*t*(c2x-c1x) +
        3*t*t*(endX-c2x);
      const dy =
        3*mt*mt*(c1y-startY) +
        6*mt*t*(c2y-c1y) +
        3*t*t*(endY-c2y);
      const len = Math.hypot(dx,dy) || 1;
      return {x:dx/len, y:dy/len};
    }

    const left = [];
    const right = [];
    const center = [];
    const steps = 44;

    for(let i=0;i<=steps;i++){
      const t = i / steps;
      const p = bezierPoint(t);
      const tan = bezierTangent(t);

      // 진행 방향에 수직.
      const nx = -tan.y;
      const ny = tan.x;

      // 바닥 원근: 가까운 25%에서 폭이 크게 줄고
      // 이후에는 먼 거리에서 천천히 수렴한다.
      const perspective = 1 - Math.pow(1 - t, 2.25);
      const width = startWidth + (endWidth - startWidth) * perspective;
      const half = width / 2;

      left.push([p.x + nx*half, p.y + ny*half]);
      right.push([p.x - nx*half, p.y - ny*half]);
      center.push([p.x, p.y]);
    }

    let d = `M ${left[0][0]} ${left[0][1]}`;
    for(let i=1;i<left.length;i++) d += ` L ${left[i][0]} ${left[i][1]}`;
    for(let i=right.length-1;i>=0;i--) d += ` L ${right[i][0]} ${right[i][1]}`;
    d += ' Z';
    guideRibbon.setAttribute('d', d);

    // 아주 얇은 중앙 반사선으로 HUD/도로 느낌을 추가.
    let centerD = `M ${center[0][0]} ${center[0][1]}`;
    for(let i=1;i<center.length;i++) centerD += ` L ${center[i][0]} ${center[i][1]}`;
    guideHighlight.setAttribute('d', centerD);

    // 직진에 가까울수록 진한 파랑, 커브가 커질수록 주황.
    // HSL 보간: blue(215deg) -> orange(30deg)
    const hue = 215 + (30 - 215) * Math.pow(severity, 0.82);
    const sat = 96;
    const lightNear = 48 + 4 * severity;
    const lightFar = 55 + 2 * severity;

    routeStopNear.setAttribute('stop-color', `hsl(${hue} ${sat}% ${lightNear}%)`);
    routeStopFar.setAttribute('stop-color', `hsl(${hue} ${sat}% ${lightFar}%)`);

    // 직진일수록 더 선명하고, 심한 곡선은 색은 주황으로 바뀌되 약간 투명하게.
    routeStopNear.setAttribute('stop-opacity', String(0.68 - 0.10 * severity));
    routeStopFar.setAttribute('stop-opacity', String(0.48 - 0.08 * severity));
  }

  function render(){
    if(targetDistance != null){
      const d = targetDistance < 1000
        ? `${Math.round(targetDistance).toLocaleString()} m`
        : `${(targetDistance/1000).toFixed(1)} km`;
      label.textContent = `목표 ${d}`;
    }

    if(currentHeading == null || targetBearing == null){
      setGuideRibbonEnd(window.innerWidth / 2, window.innerHeight / 2, 0);
      return;
    }

    const diff = norm180(targetBearing - currentHeading);
    const half = H_FOV / 2;

    headingStatus.textContent = `방향 ${Math.round(currentHeading)}°`;

    if(Math.abs(diff) <= half){
      edge.style.display = 'none';
      arrowWrap.style.display = 'flex';

      const usable = window.innerWidth * 0.76;
      let x = window.innerWidth/2 + (diff / half) * (usable/2);

      if(Math.abs(diff) < 4) x = window.innerWidth/2;

      const arrowY = window.innerHeight / 2;
      arrowWrap.style.left = `${x}px`;
      arrowWrap.style.opacity = '1';
      setGuideRibbonEnd(x, arrowY, diff);
    } else {
      arrowWrap.style.display = 'none';
      edge.style.display = 'flex';

      const edgeY = window.innerHeight / 2;
      if(diff < 0){
        edge.className = 'left';
        edge.textContent = `← 목표 ${targetDistance ? Math.round(targetDistance).toLocaleString() + ' m' : ''}`;
        setGuideRibbonEnd(18, edgeY, -30);
      } else {
        edge.className = 'right';
        edge.textContent = `목표 ${targetDistance ? Math.round(targetDistance).toLocaleString() + ' m' : ''} →`;
        setGuideRibbonEnd(window.innerWidth - 18, edgeY, 30);
      }
    }

    debug.textContent =
`목표: ${TARGET.lat}, ${TARGET.lon}
현재: ${currentPos ? currentPos.latitude.toFixed(7)+', '+currentPos.longitude.toFixed(7) : '-'}
거리: ${targetDistance != null ? targetDistance.toFixed(1)+' m' : '-'}
목표 방위각: ${targetBearing != null ? targetBearing.toFixed(1)+'°' : '-'}
현재 헤딩: ${currentHeading != null ? currentHeading.toFixed(1)+'°' : '-'}
각도 차이: ${diff.toFixed(1)}°`;
  }

  async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = stream;
  }

  function startGPS(){
    if(!navigator.geolocation){
      gpsStatus.textContent = 'GPS 미지원';
      return;
    }
    navigator.geolocation.watchPosition(pos => {
      currentPos = {
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy
      };
      gpsStatus.textContent = `GPS ±${Math.round(pos.coords.accuracy)}m`;
      updateTarget();
    }, err => {
      gpsStatus.textContent = `GPS 오류`;
      console.error(err);
    }, {
      enableHighAccuracy: true,
      maximumAge: 500,
      timeout: 15000
    });
  }

  function handleOrientation(e){
    let h = null;

    if(typeof e.webkitCompassHeading === 'number'){
      h = e.webkitCompassHeading;
    } else if(typeof e.alpha === 'number'){
      h = 360 - e.alpha;
    }

    if(h == null || !isFinite(h)) return;
    currentHeading = smoothHeading(norm360(h));
    render();
  }

  async function startOrientation(){
    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      const result = await DeviceOrientationEvent.requestPermission();
      if(result !== 'granted') throw new Error('방향 센서 권한 거부');
    }

    if('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    } else {
      window.addEventListener('deviceorientation', handleOrientation, true);
    }
  }

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = '시작 중…';
    try{
      await startCamera();
      startGPS();
      await startOrientation();
      startBtn.textContent = '실행 중';
    }catch(err){
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = '권한을 확인하고 다시 시작';
      alert('카메라/위치/방향 센서 권한을 허용해주세요. 이 기능은 HTTPS 환경에서 실행하는 것이 가장 안정적입니다.');
    }
  });

  window.addEventListener('resize', render);

  debugBtn.addEventListener('click', () => {
    debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
  });

  render();
})();
</script>
</body>
</html>
