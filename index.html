<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AR Navigation v5.0</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  #shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,.34) 0%,
        rgba(0,0,0,.05) 18%,
        rgba(0,0,0,0) 48%,
        rgba(0,0,0,.08) 72%,
        rgba(0,0,0,.34) 100%);
  }

  #routeSvg {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  #routeShadow {
    fill: rgba(0,0,0,.22);
    filter: blur(4px);
  }
  #routeRibbon {
    fill: url(#routeFill);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.22));
  }
  #routeRim {
    fill: none;
    stroke: rgba(220,242,255,.55);
    stroke-width: 2;
    stroke-linecap: round;
  }

  #routeFlowPath {
    fill: none;
    stroke: none;
    pointer-events: none;
  }

  .flowArrow {
    fill: none;
    stroke: rgba(255,255,255,.92);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.28));
    pointer-events: none;
  }

  #topStatus {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 14px;
    right: 14px;
    z-index: 8;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .pill {
    width: max-content;
    max-width: 100%;
    padding: 8px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.48);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
  }
  #versionLabel { justify-self: center; }
  #headingStatus { justify-self: end; }

  /* 하단 HUD: 거리 */
  #bottomHud {
    position: absolute;
    z-index: 9;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(96px, calc(env(safe-area-inset-bottom) + 96px));
    display: flex;
    align-items: flex-end;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,.55);
  }
  #distBlock { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #distPin {
    width: 22px;
    height: 26px;
  }
  #goalLabel {
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(0,0,0,.42);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(8px);
  }

  #distValue {
    color: #ffb04d;
    font-size: 15px;
    font-weight: 800;
  }

  #edgeHint {
    position: absolute;
    z-index: 7;
    top: 43%;
    display: none;
    align-items: center;
    gap: 7px;
    padding: 9px 11px;
    border-radius: 999px;
    background: rgba(0,0,0,.52);
    border: 1px solid rgba(255,255,255,.15);
    color: white;
    font-size: 13px;
    font-weight: 700;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #edgeHint.left { left: 12px; }
  #edgeHint.right { right: 12px; }

  #debug {
    position: absolute;
    left: 14px;
    bottom: 88px;
    z-index: 9;
    display: none;
    padding: 9px 11px;
    border-radius: 12px;
    background: rgba(0,0,0,.52);
    color: white;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    pointer-events: none;
  }

  #controls {
    position: absolute;
    z-index: 10;
    left: 14px;
    right: 14px;
    bottom: max(18px, env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
  }
  button {
    min-height: 48px;
    flex: 1;
    border: 0;
    border-radius: 16px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    background: white;
    color: #111;
  }
  button.secondary {
    flex: 0 1 92px;
    background: rgba(20,20,20,.78);
    color: white;
    border: 1px solid rgba(255,255,255,.17);
  }
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <div id="shade"></div>

  <svg id="routeSvg" aria-hidden="true">
    <defs>
      <!-- 좌(밝은 하늘색) → 우(짙은 네이비) 2톤 셰이딩. 실제 3D가 아니라
           평평한 색상만으로 입체감을 주는 트릭 (레퍼런스와 동일한 방식) -->
      <linearGradient id="routeFill" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"  stop-color="#8fd8ff" stop-opacity=".95"></stop>
        <stop offset="46%" stop-color="#2f8dff" stop-opacity=".95"></stop>
        <stop offset="100%" stop-color="#0b3f9e" stop-opacity=".95"></stop>
      </linearGradient>
    </defs>
    <path id="routeShadow"></path>
    <path id="routeRibbon"></path>
    <path id="routeFlowPath"></path>
    <g id="routeFlowArrows"></g>
    <path id="routeRim"></path>
  </svg>

  <div id="topStatus">
    <div class="pill" id="gpsStatus">GPS 대기</div>
    <div class="pill" id="versionLabel">v5.0</div>
    <div class="pill" id="headingStatus">방향 대기</div>
  </div>

  <div id="bottomHud">
    <div id="distBlock">
      <div id="goalLabel">목표 1 / 4</div>
      <svg id="distPin" viewBox="0 0 24 28">
        <path d="M12 0C5.4 0 0 5.3 0 11.8 0 20.5 12 28 12 28s12-7.5 12-16.2C24 5.3 18.6 0 12 0z" fill="#ff8a1e"></path>
        <path d="M12 2.6c-5.1 0-9.2 4.1-9.2 9.2 0 6.8 9.2 13.2 9.2 13.2s9.2-6.4 9.2-13.2c0-5.1-4.1-9.2-9.2-9.2z" fill="#ffab52"></path>
      </svg>
      <div id="distValue">-</div>
    </div>
  </div>

  <div id="edgeHint"></div>
  <div id="debug"></div>

  <div id="controls">
    <button id="prevTargetBtn" class="secondary">이전 목표</button>
    <button id="startBtn">카메라 · 위치 · 방향 시작</button>
    <button id="nextTargetBtn" class="secondary">다음 목표</button>
    <button id="debugBtn" class="secondary">정보</button>
  </div>
</div>

<script>
(() => {
  const TARGETS = [
    {
      lat: 37.5655250,
      lon: 126.9789696,
      name: '목표 1',
      guide: '시청삼거리까지 57m 이동(을지로)'
    },
    {
      lat: 37.5658711,
      lon: 126.9793000,
      name: '목표 2',
      guide: '시청삼거리에서 블랙라벨까지 31m 이동'
    },
    {
      lat: 37.5658747,
      lon: 126.9796576,
      name: '목표 3',
      guide: '블랙라벨 앞에서 오른쪽길로 68m 이동'
    },
    {
      lat: 37.5653738,
      lon: 126.9796623,
      name: '목표 4',
      guide: '[서울 중구 을지로1가 192-33] 도착'
    }
  ];

  const ARRIVAL_RADIUS_M = 5;

  // GPS 보정 설정
  const GPS_MAX_ACCURACY_M = 18;       // 이보다 나쁜 샘플은 기본적으로 무시
  const GPS_HISTORY_SIZE = 6;          // 최근 위치 샘플 수
  const GPS_JUMP_LIMIT_M = 18;         // 비정상 순간 점프 기준
  const GPS_STILL_RADIUS_M = 1.4;      // 정지로 간주할 이동량
  const ARRIVAL_CONFIRM_COUNT = 3;     // 5m 이내 연속 확인 횟수
  const ARRIVAL_RELEASE_M = 8;         // 도착 latch 해제 거리

  // 웹 데모용 추가 위치 보정
  const MAX_WALK_SPEED_MPS = 4.5;      // 약 16km/h 이상 점프는 보행으로 보기 어려움
  const ROUTE_SNAP_MAX_M = 14;         // 경로선에서 너무 멀면 스냅하지 않음
  const ROUTE_SNAP_FULL_M = 5;         // 이 거리 안에서는 강하게 경로선에 붙임
  const STALE_SAMPLE_MS = 5000;        // 너무 오래된 위치 샘플 무시


  // 카메라 실제 FOV를 웹에서 정확히 얻기 어렵기 때문에 일반 후면 광각의
  // 체감값을 사용한다. 화면 밖 목표도 유도선 곡률에는 계속 반영한다.
  const H_FOV = 64;

  const camera = document.getElementById('camera');
  const routeRibbon = document.getElementById('routeRibbon');
  const routeShadow = document.getElementById('routeShadow');
  const routeFlowPath = document.getElementById('routeFlowPath');
  const routeFlowArrows = document.getElementById('routeFlowArrows');
  const routeRim = document.getElementById('routeRim');

  const distValue = document.getElementById('distValue');
  const goalLabel = document.getElementById('goalLabel');
  const edgeHint = document.getElementById('edgeHint');

  const gpsStatus = document.getElementById('gpsStatus');
  const headingStatus = document.getElementById('headingStatus');
  const debug = document.getElementById('debug');
  const startBtn = document.getElementById('startBtn');
  const prevTargetBtn = document.getElementById('prevTargetBtn');
  const nextTargetBtn = document.getElementById('nextTargetBtn');
  const debugBtn = document.getElementById('debugBtn');

  let currentPos = null;
  let targetBearing = null;
  let targetDistance = null;

  let targetIndex = 0;
  let arrivalLatched = false;
  let arrivalConfirmCount = 0;

  // GPS smoothing state
  const gpsHistory = [];
  let filteredPos = null;
  let lastAcceptedRawPos = null;
  let lastAcceptedTimestamp = null;
  let lastRawAccuracy = null;
  let lastSnapDistance = null;
  let lastSnapStrength = 0;

  // raw sensor state
  let rawHeading = null;

  // filtered state
  let filteredHeading = null;
  let rawPitch = 0;
  let filteredPitch = 7;
  let visualDiff = 0;
  let desiredDiff = 0;
  let alignedLock = false;
  let previousRawDiff = null;

  let rafId = null;
  let started = false;
  const CHEVRON_SPACING = 62;      // 화면상 누적 경로 거리(px)
  const CHEVRON_SPEED = 54;        // 목표 방향으로 흐르는 속도(px/s)
  const CHEVRON_WIDTH_RATIO = 0.72;

  let chevronPhase = 0;
  let lastFrameTime = null;
  let currentFlowSamples = [];

  function toRad(d){ return d * Math.PI / 180; }
  function toDeg(r){ return r * 180 / Math.PI; }
  function norm360(d){ return (d % 360 + 360) % 360; }
  function norm180(d){ return ((d + 540) % 360) - 180; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function haversine(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dp = toRad(lat2-lat1), dl = toRad(lon2-lon1);
    const a = Math.sin(dp/2)**2 +
      Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function bearing(lat1, lon1, lat2, lon2){
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dl = toRad(lon2-lon1);
    const y = Math.sin(dl)*Math.cos(p2);
    const x = Math.cos(p1)*Math.sin(p2) -
      Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
    return norm360(toDeg(Math.atan2(y,x)));
  }

  function formatDistance(m){
    if(m == null) return '-';
    if(m < 1000) return `${Math.round(m).toLocaleString()}m`;
    return `${(m/1000).toFixed(1)}km`;
  }

  function latLonToLocalMeters(lat, lon, refLat, refLon){
    const R = 6371000;
    const x = toRad(lon - refLon) * R * Math.cos(toRad((lat + refLat) / 2));
    const y = toRad(lat - refLat) * R;
    return {x, y};
  }

  function localMetersToLatLon(x, y, refLat, refLon){
    const R = 6371000;
    const lat = refLat + toDeg(y / R);
    const lon = refLon + toDeg(x / (R * Math.cos(toRad((lat + refLat) / 2))));
    return {latitude: lat, longitude: lon};
  }

  function nearestPointOnSegmentMeters(pos, a, b){
    const refLat = pos.latitude;
    const refLon = pos.longitude;

    const p = {x:0, y:0};
    const aa = latLonToLocalMeters(a.lat, a.lon, refLat, refLon);
    const bb = latLonToLocalMeters(b.lat, b.lon, refLat, refLon);

    const vx = bb.x - aa.x;
    const vy = bb.y - aa.y;
    const len2 = vx*vx + vy*vy;

    if(len2 < 0.0001){
      return {
        latitude: a.lat,
        longitude: a.lon,
        distance: Math.hypot(aa.x, aa.y),
        t: 0
      };
    }

    let t = ((p.x-aa.x)*vx + (p.y-aa.y)*vy) / len2;
    t = clamp(t, 0, 1);

    const qx = aa.x + vx*t;
    const qy = aa.y + vy*t;

    const ll = localMetersToLatLon(qx, qy, refLat, refLon);

    return {
      latitude: ll.latitude,
      longitude: ll.longitude,
      distance: Math.hypot(qx, qy),
      t
    };
  }

  function applyRouteSnap(pos){
    // 목표1 이전에는 출발 경로가 없으므로 GPS를 그대로 사용한다.
    if(targetIndex <= 0){
      lastSnapDistance = null;
      lastSnapStrength = 0;
      return pos;
    }

    const prev = TARGETS[targetIndex - 1];
    const curr = TARGETS[targetIndex];
    const snap = nearestPointOnSegmentMeters(pos, prev, curr);

    lastSnapDistance = snap.distance;

    // 현재 위치가 경로에서 너무 멀면 다른 길일 가능성이 있으므로 스냅하지 않는다.
    if(snap.distance > ROUTE_SNAP_MAX_M){
      lastSnapStrength = 0;
      return pos;
    }

    // accuracy가 나쁠수록 경로선 신뢰도를 높인다.
    const accFactor = clamp((pos.accuracy - 3) / 10, 0, 1);

    // 경로선에 가까울수록 강하게 붙인다.
    const distanceFactor =
      snap.distance <= ROUTE_SNAP_FULL_M
        ? 1
        : clamp(
            1 - (snap.distance - ROUTE_SNAP_FULL_M) /
                (ROUTE_SNAP_MAX_M - ROUTE_SNAP_FULL_M),
            0,
            1
          );

    // 최소 35%, accuracy가 나쁠 때 최대 약 90%까지 스냅.
    const strength = distanceFactor * (0.35 + 0.55 * accFactor);
    lastSnapStrength = strength;

    return {
      latitude: pos.latitude + (snap.latitude - pos.latitude) * strength,
      longitude: pos.longitude + (snap.longitude - pos.longitude) * strength,
      accuracy: pos.accuracy
    };
  }

  function distanceBetweenPos(a, b){
    if(!a || !b) return Infinity;
    return haversine(a.latitude, a.longitude, b.latitude, b.longitude);
  }

  function addGpsSample(sample){
    const now = Date.now();

    // 너무 오래 전에 만들어진 위치는 사용하지 않는다.
    if(sample.timestamp && now - sample.timestamp > STALE_SAMPLE_MS){
      return false;
    }

    // 정확도가 너무 나쁜 샘플은 경로 계산에 사용하지 않는다.
    if(!Number.isFinite(sample.accuracy) || sample.accuracy > GPS_MAX_ACCURACY_M){
      return false;
    }

    lastRawAccuracy = sample.accuracy;

    if(lastAcceptedRawPos && lastAcceptedTimestamp){
      const dt = Math.max(0.2, (sample.timestamp - lastAcceptedTimestamp) / 1000);
      const jump = distanceBetweenPos(lastAcceptedRawPos, sample);
      const impliedSpeed = jump / dt;

      // 1) 큰 순간 점프
      if(jump > GPS_JUMP_LIMIT_M && sample.accuracy > 6){
        return false;
      }

      // 2) 보행 중이라고 보기 어려운 순간 속도
      // accuracy가 매우 좋은 샘플(<=4m)은 조금 관대하게 통과.
      if(impliedSpeed > MAX_WALK_SPEED_MPS && sample.accuracy > 4){
        return false;
      }
    }

    lastAcceptedRawPos = sample;
    lastAcceptedTimestamp = sample.timestamp;

    gpsHistory.push(sample);
    if(gpsHistory.length > GPS_HISTORY_SIZE){
      gpsHistory.shift();
    }

    // 최근 샘플들의 accuracy 가중 평균.
    // 최근 샘플에 약간 더 높은 시간 가중치도 부여한다.
    let sumW = 0;
    let lat = 0;
    let lon = 0;
    let acc = 0;

    for(let i=0;i<gpsHistory.length;i++){
      const p = gpsHistory[i];
      const ageWeight = 0.65 + 0.35 * ((i + 1) / gpsHistory.length);
      const accuracyWeight = 1 / Math.max(1, p.accuracy * p.accuracy);
      const w = accuracyWeight * ageWeight;

      sumW += w;
      lat += p.latitude * w;
      lon += p.longitude * w;
      acc += p.accuracy * w;
    }

    let weighted = {
      latitude: lat / sumW,
      longitude: lon / sumW,
      accuracy: acc / sumW
    };

    if(!filteredPos){
      filteredPos = weighted;
    }else{
      const move = distanceBetweenPos(filteredPos, weighted);

      // 정지 상태: GPS drift를 거의 고정.
      if(move <= GPS_STILL_RADIUS_M){
        const alpha = 0.08;
        filteredPos = {
          latitude:
            filteredPos.latitude +
            (weighted.latitude - filteredPos.latitude) * alpha,
          longitude:
            filteredPos.longitude +
            (weighted.longitude - filteredPos.longitude) * alpha,
          accuracy: weighted.accuracy
        };
      }else{
        // 실제 이동은 거리와 accuracy에 따라 적응적으로 추종.
        const accuracyFactor = clamp((12 - weighted.accuracy) / 9, 0, 1);

        let alpha =
          move > 8 ? 0.58 :
          move > 4 ? 0.42 :
                     0.28;

        alpha *= 0.75 + accuracyFactor * 0.25;

        filteredPos = {
          latitude:
            filteredPos.latitude +
            (weighted.latitude - filteredPos.latitude) * alpha,
          longitude:
            filteredPos.longitude +
            (weighted.longitude - filteredPos.longitude) * alpha,
          accuracy: weighted.accuracy
        };
      }
    }

    // 현재 활성 경로 구간에 대한 map-matching 보정.
    const snapped = applyRouteSnap(filteredPos);

    currentPos = {
      latitude: snapped.latitude,
      longitude: snapped.longitude,
      accuracy: filteredPos.accuracy
    };

    return true;
  }

  function getActiveTarget(){
    return TARGETS[targetIndex];
  }

  function updateTargetUi(){
    goalLabel.textContent = `${getActiveTarget().name} / ${TARGETS.length} · ${getActiveTarget().guide}`;
    prevTargetBtn.disabled = targetIndex <= 0;
    nextTargetBtn.disabled = targetIndex >= TARGETS.length - 1;
  }

  function setTargetIndex(nextIndex, reason='manual'){
    const clamped = clamp(nextIndex, 0, TARGETS.length - 1);
    if(clamped === targetIndex) return;

    targetIndex = clamped;
    arrivalLatched = false;
    arrivalConfirmCount = 0;
    lastSnapDistance = null;
    lastSnapStrength = 0;
    alignedLock = false;
    previousRawDiff = null;
    desiredDiff = 0;
    visualDiff = 0;

    updateTargetUi();
    updateTargetFromGps();
  }

  function updateTargetFromGps(){
    if(!currentPos) return;

    const target = getActiveTarget();

    targetBearing = bearing(
      currentPos.latitude, currentPos.longitude,
      target.lat, target.lon
    );

    targetDistance = haversine(
      currentPos.latitude, currentPos.longitude,
      target.lat, target.lon
    );

    distValue.textContent = formatDistance(targetDistance);

    // 5m 안에 "연속으로" 들어온 것이 확인될 때만 다음 목표로 전환.
    // GPS 한 번 튄 값으로 자동 전환되는 것을 방지한다.
    if(targetDistance <= ARRIVAL_RADIUS_M){
      arrivalConfirmCount += 1;

      if(!arrivalLatched && arrivalConfirmCount >= ARRIVAL_CONFIRM_COUNT){
        arrivalLatched = true;

        if(targetIndex < TARGETS.length - 1){
          setTargetIndex(targetIndex + 1, 'arrival');
          return;
        }
      }
    }else{
      arrivalConfirmCount = 0;

      if(targetDistance >= ARRIVAL_RELEASE_M){
        arrivalLatched = false;
      }
    }
  }

  function ingestHeading(newHeading){
    if(!Number.isFinite(newHeading)) return;

    rawHeading = norm360(newHeading);

    if(filteredHeading == null){
      filteredHeading = rawHeading;
      return;
    }

    const delta = norm180(rawHeading-filteredHeading);

    // 정지 상태의 작은 센서 떨림만 제거한다.
    if(Math.abs(delta) < 0.65) return;

    // 회전 중에는 지연이 생기지 않도록 훨씬 빠르게 따라간다.
    const alpha =
      Math.abs(delta) > 35 ? 0.48 :
      Math.abs(delta) > 18 ? 0.38 :
      Math.abs(delta) > 8  ? 0.28 :
      Math.abs(delta) > 3  ? 0.18 :
                             0.10;

    filteredHeading = norm360(filteredHeading + delta*alpha);
  }

  function handleOrientation(e){
    let h = null;

    if(typeof e.webkitCompassHeading === 'number'){
      h = e.webkitCompassHeading;
    }else if(typeof e.alpha === 'number'){
      const screenAngle =
        (screen.orientation && typeof screen.orientation.angle === 'number')
          ? screen.orientation.angle
          : (typeof window.orientation === 'number' ? window.orientation : 0);
      h = norm360(360 - e.alpha + screenAngle);
    }

    if(h != null) ingestHeading(h);

    if(typeof e.beta === 'number'){
      rawPitch = clamp(90 - e.beta, -25, 45);
      const pd = rawPitch - filteredPitch;
      filteredPitch += pd * (Math.abs(pd) > 8 ? 0.16 : 0.07);
    }
  }

  // 실제 3D 지면 좌표계에서 경로를 만든 뒤 카메라 화면으로 투영한다.
  // 별도의 화살표 머리/네크 조각을 붙이지 않고, 폭 보간만으로 표현한다.
  function buildRoute(diff){
    const W = window.innerWidth;
    const H = window.innerHeight;

    const CAMERA_HEIGHT_M = 1.55;
    const hFov = toRad(H_FOV);
    const vFov = 2 * Math.atan(Math.tan(hFov/2) * (H/W));
    const fx = (W/2) / Math.tan(hFov/2);
    const fy = (H/2) / Math.tan(vFov/2);
    const cx = W/2;
    const cy = H/2;
    const pitch = toRad(clamp(filteredPitch, -18, 32));

    function projectGround(x,z){
      const y = -CAMERA_HEIGHT_M;
      const yc = y*Math.cos(pitch) + z*Math.sin(pitch);
      const zc = -y*Math.sin(pitch) + z*Math.cos(pitch);
      if(zc <= 0.35) return null;
      return {x:cx + fx*(x/zc), y:cy - fy*(yc/zc), depth:zc};
    }

    const theta = toRad(clamp(diff,-179.5,179.5));
    const absTheta = Math.abs(theta);
    const PATH_LENGTH_M = absTheta < toRad(35) ? 16 : absTheta < toRad(90) ? 14 : 12;
    const samples = 140;
    const centerWorld = [];

    for(let i=0;i<=samples;i++){
      const s = PATH_LENGTH_M*(i/samples);
      let x,z;
      if(absTheta < 1e-4){
        x=0; z=s;
      }else{
        const k = theta/PATH_LENGTH_M;
        x = (1-Math.cos(k*s))/k;
        z = Math.sin(k*s)/k;
      }
      centerWorld.push({x,z,s});
    }

    const ROUTE_WIDTH_M = 1.25;
    const leftScreen=[], rightScreen=[], centerScreen=[], widthScreen=[];
    let visibleStarted=false;

    for(let i=0;i<centerWorld.length;i++){
      const p=centerWorld[i];
      const prev=centerWorld[Math.max(0,i-1)];
      const next=centerWorld[Math.min(centerWorld.length-1,i+1)];
      const tx=next.x-prev.x, tz=next.z-prev.z;
      const tlen=Math.hypot(tx,tz)||1;
      const nx=-tz/tlen, nz=tx/tlen;
      const u=i/(centerWorld.length-1);
      let widthScale=1;
      if(u>0.86) widthScale=Math.max(0,1-(u-0.86)/0.14);
      const half=ROUTE_WIDTH_M*widthScale/2;

      const c=projectGround(p.x,p.z);
      const l=projectGround(p.x+nx*half,p.z+nz*half);
      const r=projectGround(p.x-nx*half,p.z-nz*half);
      const valid=c&&l&&r;
      if(valid){
        visibleStarted=true;
        centerScreen.push(c);
        leftScreen.push(l); rightScreen.push(r);
        widthScreen.push(Math.hypot(r.x-l.x, r.y-l.y));
      }else if(visibleStarted){
        break;
      }
    }

    if(leftScreen.length<2) return {ribbonD:'',rimD:'',flowD:'',flowSamples:[],visibleCount:0};

    let flowD=`M ${centerScreen[0].x} ${centerScreen[0].y}`;
    for(let i=1;i<centerScreen.length;i++) flowD+=` L ${centerScreen[i].x} ${centerScreen[i].y}`;

    let ribbonD=`M ${leftScreen[0].x} ${leftScreen[0].y}`;
    for(let i=1;i<leftScreen.length;i++) ribbonD+=` L ${leftScreen[i].x} ${leftScreen[i].y}`;
    for(let i=rightScreen.length-1;i>=0;i--) ribbonD+=` L ${rightScreen[i].x} ${rightScreen[i].y}`;
    ribbonD+=' Z';

    let rimD=`M ${leftScreen[0].x} ${leftScreen[0].y}`;
    for(let i=1;i<leftScreen.length;i++) rimD+=` L ${leftScreen[i].x} ${leftScreen[i].y}`;

    const flowSamples = centerScreen.map((p,i)=>({
      x:p.x,
      y:p.y,
      width:widthScreen[i] || 1
    }));

    return {ribbonD,rimD,flowD,flowSamples,visibleCount:leftScreen.length};
  }

  function ensureFlowArrows(count){
    while(routeFlowArrows.children.length < count){
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      // 기본 형태: 진행 방향을 향하는 열린 chevron(">")
      // 로컬 기준 진행 방향은 위쪽(-Y).
      p.setAttribute('d','M -12 8 L 0 -8 L 12 8');
      p.setAttribute('class','flowArrow');
      routeFlowArrows.appendChild(p);
    }
    while(routeFlowArrows.children.length > count){
      routeFlowArrows.lastChild.remove();
    }
  }

  function buildChevronMetrics(samples){
    if(!samples || samples.length < 2) return null;

    const cumulative = [0];
    let total = 0;

    for(let i=1;i<samples.length;i++){
      total += Math.hypot(
        samples[i].x - samples[i-1].x,
        samples[i].y - samples[i-1].y
      );
      cumulative.push(total);
    }

    return {samples, cumulative, total};
  }

  function sampleChevronAtDistance(metrics, distance){
    const {samples, cumulative, total} = metrics;
    if(total <= 0) return null;

    distance = clamp(distance, 0, total);

    let lo = 0;
    let hi = cumulative.length - 1;

    while(lo < hi){
      const mid = (lo + hi) >> 1;
      if(cumulative[mid] < distance) lo = mid + 1;
      else hi = mid;
    }

    const j = clamp(lo, 1, samples.length - 1);
    const i = j - 1;

    const d0 = cumulative[i];
    const d1 = cumulative[j];
    const seg = Math.max(0.0001, d1 - d0);
    const u = clamp((distance - d0) / seg, 0, 1);

    const a = samples[i];
    const b = samples[j];

    return {
      x: a.x + (b.x-a.x)*u,
      y: a.y + (b.y-a.y)*u,
      width: a.width + (b.width-a.width)*u,
      progress: distance / total,
      angle: Math.atan2(b.y-a.y, b.x-a.x) * 180 / Math.PI + 90
    };
  }

  function buildChevrons(dt){
    const metrics = buildChevronMetrics(currentFlowSamples);

    if(!metrics || metrics.total < 30){
      ensureFlowArrows(0);
      return;
    }

    // 누적 거리를 따라 phase가 계속 증가하면서 목표 방향으로 흐른다.
    chevronPhase =
      (chevronPhase + CHEVRON_SPEED * dt) % CHEVRON_SPACING;

    const positions = [];

    // 시작점에서 phase만큼 앞선 지점부터 일정 간격으로 배치.
    // centerline은 사용자 쪽 -> 목표 쪽 순서이므로 phase 증가 = 목표 방향 이동.
    for(
      let d = chevronPhase + 16;
      d < metrics.total - 12;
      d += CHEVRON_SPACING
    ){
      positions.push(d);
    }

    ensureFlowArrows(Math.min(12, positions.length));

    for(let i=0;i<routeFlowArrows.children.length;i++){
      const d = positions[i];
      const p = sampleChevronAtDistance(metrics, d);
      if(!p) continue;

      // t는 "카메라에 얼마나 가까운가": 가까움=1, 멂=0.
      const t = clamp(1 - p.progress, 0, 1);

      // 요청한 리본 원근식.
      const perspective = 1 - Math.pow(1 - t, 3.1);

      // 실제 투영된 리본 폭에 비례시키고,
      // 같은 원근식을 추가 적용해 멀리 있는 chevron을 더 자연스럽게 축소.
      const desiredWidth = clamp(
        p.width * CHEVRON_WIDTH_RATIO * (0.55 + 0.45 * perspective),
        12,
        86
      );

      // 기본 chevron 폭 약 24px
      const scale = desiredWidth / 24;

      // 가까울수록 진하고, 멀수록 흐리게.
      const opacity = 0.28 + 0.68 * perspective;

      const arrow = routeFlowArrows.children[i];
      arrow.setAttribute(
        'transform',
        `translate(${p.x} ${p.y}) rotate(${p.angle}) scale(${scale})`
      );
      arrow.setAttribute('opacity', opacity.toFixed(3));

      // stroke도 함께 줄여 원근감이 더 자연스럽게 보이게 함.
      const strokeWidth = clamp(3.2 + 2.4 * perspective, 3.2, 5.6);
      arrow.setAttribute('stroke-width', strokeWidth.toFixed(2));
    }
  }

  function renderRoute(now){
    if(targetBearing != null && rawHeading != null){
      const rawDiff = norm180(targetBearing-rawHeading);

      if(!alignedLock && Math.abs(rawDiff) <= 4){
        alignedLock = true;
      }else if(alignedLock && Math.abs(rawDiff) >= 7){
        alignedLock = false;
      }

      const crossedTarget =
        previousRawDiff != null &&
        Math.sign(previousRawDiff) !== Math.sign(rawDiff) &&
        Math.abs(rawDiff) < 12 &&
        Math.abs(previousRawDiff) < 12;

      previousRawDiff = rawDiff;

      if(alignedLock || crossedTarget){
        desiredDiff = 0;
        visualDiff *= 0.35;
      }else if(filteredHeading != null){
        desiredDiff = norm180(targetBearing-filteredHeading);
      }
    }

    const delta = norm180(desiredDiff-visualDiff);
    const visualAlpha =
      Math.abs(delta) > 70 ? 0.30 :
      Math.abs(delta) > 35 ? 0.23 :
      Math.abs(delta) > 15 ? 0.17 :
      Math.abs(delta) > 6  ? 0.12 :
                             0.075;

    if(Math.abs(delta) < 0.45){
      visualDiff = desiredDiff;
    }else{
      visualDiff += delta*visualAlpha;
    }

    if(alignedLock && Math.abs(visualDiff) < 1.2){
      visualDiff = 0;
    }

    const route = buildRoute(visualDiff);
    routeRibbon.setAttribute('d',route.ribbonD);
    routeShadow.setAttribute('d',route.ribbonD);
    routeFlowPath.setAttribute('d',route.flowD || '');
    routeRim.setAttribute('d',route.rimD);
    currentFlowSamples = route.flowSamples || [];

    const dt = lastFrameTime == null ? 0 : Math.min(0.05, (now - lastFrameTime) / 1000);
    lastFrameTime = now;
    buildChevrons(dt);

    const halfFov = H_FOV/2;
    const onScreen = Math.abs(visualDiff) <= halfFov;

    if(onScreen){
      edgeHint.style.display = 'none';
    }else{
      edgeHint.style.display = 'flex';
      if(visualDiff < 0){
        edgeHint.className = 'left';
        edgeHint.textContent = `← ${formatDistance(targetDistance)}`;
      }else{
        edgeHint.className = 'right';
        edgeHint.textContent = `${formatDistance(targetDistance)} →`;
      }
    }

    if(filteredHeading != null){
      headingStatus.textContent = `방향 ${Math.round(filteredHeading)}°`;
    }

    debug.textContent =
`목표: ${getActiveTarget().name} (${getActiveTarget().lat}, ${getActiveTarget().lon})
현재: ${currentPos ? currentPos.latitude.toFixed(7)+', '+currentPos.longitude.toFixed(7) : '-'}
거리: ${targetDistance != null ? targetDistance.toFixed(1)+' m' : '-'}
GPS raw accuracy: ${lastRawAccuracy != null ? lastRawAccuracy.toFixed(1)+' m' : '-'}
GPS 보정 accuracy: ${currentPos ? currentPos.accuracy.toFixed(1)+' m' : '-'}
경로 이탈거리: ${lastSnapDistance != null ? lastSnapDistance.toFixed(1)+' m' : '-'}
경로 스냅강도: ${(lastSnapStrength*100).toFixed(0)}%
도착 확인: ${arrivalConfirmCount}/${ARRIVAL_CONFIRM_COUNT}
목표 방위각: ${targetBearing != null ? targetBearing.toFixed(1)+'°' : '-'}
필터 헤딩: ${filteredHeading != null ? filteredHeading.toFixed(1)+'°' : '-'}
카메라 피치: ${filteredPitch.toFixed(1)}°
방향 차이: ${visualDiff.toFixed(1)}°`;

    rafId = requestAnimationFrame(renderRoute);
  }

  async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    camera.srcObject = stream;
  }

  function startGPS(){
    if(!navigator.geolocation){
      gpsStatus.textContent = 'GPS 미지원';
      return;
    }

    navigator.geolocation.watchPosition(pos=>{
      const sample = {
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        timestamp: pos.timestamp || Date.now()
      };

      const accepted = addGpsSample(sample);

      if(accepted){
        const snapText =
          lastSnapDistance == null
            ? ''
            : ` · 경로 ${lastSnapDistance.toFixed(1)}m`;

        gpsStatus.textContent =
          `GPS ±${Math.round(currentPos.accuracy)}m · 보정${snapText}`;
        updateTargetFromGps();
      }else{
        gpsStatus.textContent =
          `GPS ±${Math.round(pos.coords.accuracy)}m · 대기`;
      }
    },err=>{
      gpsStatus.textContent = 'GPS 오류';
      console.error(err);
    },{
      enableHighAccuracy:true,
      maximumAge:400,
      timeout:15000
    });
  }

  async function startOrientation(){
    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      const result = await DeviceOrientationEvent.requestPermission();
      if(result !== 'granted') throw new Error('방향 센서 권한 거부');
    }

    if('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute',handleOrientation,true);
    }else{
      window.addEventListener('deviceorientation',handleOrientation,true);
    }
  }

  startBtn.addEventListener('click',async()=>{
    if(started) return;

    startBtn.disabled = true;
    startBtn.textContent = '시작 중…';

    try{
      await startCamera();
      startGPS();
      await startOrientation();

      started = true;
      startBtn.textContent = '실행 중';

      if(!rafId) rafId = requestAnimationFrame(renderRoute);
    }catch(err){
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = '권한 확인 후 다시 시작';
      alert('카메라·위치·방향 센서 권한을 허용해주세요. HTTPS 환경에서 실행해주세요.');
    }
  });

  prevTargetBtn.addEventListener('click',()=>{
    setTargetIndex(targetIndex - 1, 'manual');
  });

  nextTargetBtn.addEventListener('click',()=>{
    setTargetIndex(targetIndex + 1, 'manual');
  });

  debugBtn.addEventListener('click',()=>{
    debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
  });

  window.addEventListener('resize',()=>{
    if(!rafId) renderRoute();
  });

  // 권한 전에도 레이아웃 형태는 보이도록 초기 렌더.
  routeRibbon.setAttribute('d','');
  routeShadow.setAttribute('d','');
  routeFlowPath.setAttribute('d','');
  routeRim.setAttribute('d','');
  ensureFlowArrows(0);
  updateTargetUi();
})();
</script>
</body>
</html>
