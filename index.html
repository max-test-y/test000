<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AR Navigation v6.3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin="">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
  }
  #camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  #shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,.34) 0%,
        rgba(0,0,0,.05) 18%,
        rgba(0,0,0,0) 48%,
        rgba(0,0,0,.08) 72%,
        rgba(0,0,0,.34) 100%);
  }

  #routeSvg {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  #routeShadow {
    fill: rgba(0,0,0,.22);
    filter: blur(4px);
  }
  #routeRibbon {
    fill: url(#routeFill);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.22));
  }
  #routeBottomSkirt {
    fill: url(#routeFill);
    pointer-events: none;
  }
  #routeRim {
    fill: none;
    stroke: rgba(220,242,255,.55);
    stroke-width: 2;
    stroke-linecap: round;
  }
  #routeEndBorder {
    fill: none;
    stroke: #2f8dff;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }
  #routeChevrons path {
    fill: none;
    stroke: url(#chevronStroke);
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #routeEndPulse {
    fill: none;
    stroke: rgba(220,242,255,.6);
    stroke-width: 2;
    transform-box: fill-box;
    transform-origin: center;
    animation: endPulse 1.8s ease-out infinite;
  }
  #routeEndHalo {
    fill: rgba(47,141,255,.20);
    stroke: rgba(220,242,255,.7);
    stroke-width: 2;
  }
  #routeEndDot {
    fill: #eaf6ff;
    stroke: #2f8dff;
    stroke-width: 4;
  }
  @keyframes endPulse {
    0%   { transform: scale(0.8);  opacity: .65; }
    75%  { transform: scale(1.9);  opacity: 0; }
    100% { transform: scale(1.9);  opacity: 0; }
  }

  #topStatus {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 14px;
    right: 14px;
    z-index: 8;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .pill {
    width: max-content;
    max-width: 100%;
    padding: 8px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.48);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
  }
  #versionLabel { justify-self: center; }
  #headingStatus { justify-self: end; }

  /* 하단 HUD: 거리 */
  #bottomHud {
    position: absolute;
    z-index: 9;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(96px, calc(env(safe-area-inset-bottom) + 96px));
    display: flex;
    align-items: flex-end;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,.55);
  }
  #distBlock { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #distPin {
    width: 22px;
    height: 26px;
  }
  #goalLabel {
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(0,0,0,.42);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(8px);
  }

  #distValue {
    color: #ffb04d;
    font-size: 15px;
    font-weight: 800;
  }

  #edgeHint {
    position: absolute;
    z-index: 7;
    top: 43%;
    display: none;
    align-items: center;
    gap: 7px;
    padding: 9px 11px;
    border-radius: 999px;
    background: rgba(0,0,0,.52);
    border: 1px solid rgba(255,255,255,.15);
    color: white;
    font-size: 13px;
    font-weight: 700;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #edgeHint.left { left: 12px; }
  #edgeHint.right { right: 12px; }

  #sensorToast {
    position: absolute;
    left: 50%;
    bottom: max(150px, calc(env(safe-area-inset-bottom) + 150px));
    z-index: 20;
    max-width: min(88vw, 420px);
    padding: 12px 16px;
    border-radius: 14px;
    background: rgba(20,20,20,.88);
    border: 1px solid rgba(255,255,255,.16);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.45;
    text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,.32);
    backdrop-filter: blur(10px);
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 12px);
    transition: opacity .22s ease, transform .22s ease;
  }

  #sensorToast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  #debug {
    position: absolute;
    left: 14px;
    bottom: 88px;
    z-index: 9;
    display: none;
    padding: 9px 11px;
    border-radius: 12px;
    background: rgba(0,0,0,.52);
    color: white;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    pointer-events: none;
  }

  #controls {
    position: absolute;
    z-index: 10;
    left: 14px;
    right: 14px;
    bottom: max(18px, env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
  }
  button {
    min-height: 48px;
    flex: 1;
    border: 0;
    border-radius: 16px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    background: white;
    color: #111;
  }
  button.secondary {
    flex: 0 1 92px;
    background: rgba(20,20,20,.78);
    color: white;
    border: 1px solid rgba(255,255,255,.17);
  }

  #mapTargetBtn {
    position: absolute;
    z-index: 12;
    top: max(58px, calc(env(safe-area-inset-top) + 58px));
    right: 14px;
    min-height: 0;
    width: auto;
    flex: none;
    padding: 9px 12px;
    border-radius: 999px;
    background: rgba(20,20,20,.72);
    color: #fff;
    border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(10px);
    font-size: 12px;
    font-weight: 800;
  }

  #targetMapModal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    background: #111;
  }
  #targetMapModal.show { display: flex; }

  #targetMapHeader {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    background: rgba(18,18,18,.96);
    color: #fff;
  }
  #targetMapTitle {
    flex: 1;
    min-width: 0;
  }
  #targetMapTitle strong {
    display: block;
    font-size: 15px;
    margin-bottom: 3px;
  }
  #targetMapTitle span {
    display: block;
    font-size: 11px;
    opacity: .72;
  }
  #targetMapClose {
    flex: 0 0 auto;
    min-height: 38px;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,.16);
    font-size: 13px;
  }

  #targetMap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    background: #ddd;
  }

  #targetMapFooter {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 12px 12px max(12px, env(safe-area-inset-bottom));
    background: rgba(18,18,18,.98);
    color: #fff;
  }
  #targetCoordText {
    min-width: 0;
    font-size: 12px;
    line-height: 1.45;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #targetMapConfirm {
    flex: 0 0 auto;
    min-height: 42px;
    padding: 10px 15px;
    border-radius: 13px;
    background: #fff;
    color: #111;
    font-size: 13px;
    font-weight: 800;
  }

  .leaflet-container {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <div id="shade"></div>

  <svg id="routeSvg" aria-hidden="true">
    <defs>
      <linearGradient id="routeFill" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"  stop-color="#8fd8ff" stop-opacity=".95"></stop>
        <stop offset="46%" stop-color="#2f8dff" stop-opacity=".95"></stop>
        <stop offset="100%" stop-color="#0b3f9e" stop-opacity=".95"></stop>
      </linearGradient>
      <linearGradient id="chevronStroke" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#eaf6ff" stop-opacity=".95"></stop>
        <stop offset="100%" stop-color="#8ad2ff" stop-opacity=".9"></stop>
      </linearGradient>
    </defs>
    <path id="routeShadow"></path>
    <path id="routeBottomSkirt"></path>
    <path id="routeRibbon"></path>
    <path id="routeRim"></path>
    <path id="routeEndBorder"></path>
    <g id="routeChevrons"></g>
    <circle id="routeEndPulse" r="16"></circle>
    <circle id="routeEndHalo" r="16"></circle>
    <circle id="routeEndDot" r="6"></circle>
  </svg>

  <div id="topStatus">
    <div class="pill" id="gpsStatus">GPS 대기</div>
    <div class="pill" id="versionLabel">v6.3</div>
    <div class="pill" id="headingStatus">방향 대기</div>
  </div>

  <div id="bottomHud">
    <div id="distBlock">
      <div id="goalLabel">목표 1 / 5</div>
      <svg id="distPin" viewBox="0 0 24 28">
        <path d="M12 0C5.4 0 0 5.3 0 11.8 0 20.5 12 28 12 28s12-7.5 12-16.2C24 5.3 18.6 0 12 0z" fill="#ff8a1e"></path>
        <path d="M12 2.6c-5.1 0-9.2 4.1-9.2 9.2 0 6.8 9.2 13.2 9.2 13.2s9.2-6.4 9.2-13.2c0-5.1-4.1-9.2-9.2-9.2z" fill="#ffab52"></path>
      </svg>
      <div id="distValue">-</div>
    </div>
  </div>

  <div id="edgeHint"></div>
  <div id="sensorToast" role="status" aria-live="polite"></div>
  <div id="debug"></div>

  <button id="mapTargetBtn" type="button">목표 변경</button>

  <div id="controls">
    <button id="prevTargetBtn" class="secondary">이전 목표</button>
    <button id="startBtn">카메라 · 위치 · 방향 시작</button>
    <button id="nextTargetBtn" class="secondary">다음 목표</button>
    <button id="debugBtn" class="secondary">정보</button>
  </div>
</div>

<div id="targetMapModal" aria-hidden="true">
  <div id="targetMapHeader">
    <div id="targetMapTitle">
      <strong>목표 지점 변경</strong>
      <span>지도를 터치한 뒤 ‘이 위치로 변경’을 누르세요.</span>
    </div>
    <button id="targetMapClose" type="button">닫기</button>
  </div>
  <div id="targetMap"></div>
  <div id="targetMapFooter">
    <div id="targetCoordText">지도를 터치해 위치를 선택하세요.</div>
    <button id="targetMapConfirm" type="button">이 위치로 변경</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  crossorigin=""></script>
<script>
(() => {
  const TARGETS = [
    {
      lat: 37.5657088,
      lon: 126.9790601,
      name: '목표 1',
      guide: '72m 이동(을지로)'
    },
    {
      lat: 37.5651033,
      lon: 126.9787614,
      name: '목표 2',
      guide: '횡단보도 이용'
    },
    {
      lat: 37.5652114,
      lon: 126.9784761,
      name: '목표 3',
      guide: '85m 이동(소공로)'
    },
    {
      lat: 37.5651067,
      lon: 126.9775616,
      name: '목표 4',
      guide: '횡단보도 이용'
    },
    {
      lat: 37.5648400,
      lon: 126.9775074,
      name: '목표 5',
      guide: '[서울 중구 태평로2가 113-1] 도착'
    }
  ];

  const ARRIVAL_RADIUS_M = 5;

  // GPS 보정 설정
  const GPS_MAX_ACCURACY_M = 18;       // 이보다 나쁜 샘플은 기본적으로 무시
  const GPS_HISTORY_SIZE = 6;          // 최근 위치 샘플 수
  const GPS_JUMP_LIMIT_M = 18;         // 비정상 순간 점프 기준
  const GPS_STILL_RADIUS_M = 1.4;      // 정지로 간주할 이동량
  const ARRIVAL_CONFIRM_COUNT = 3;     // 5m 이내 연속 확인 횟수
  const ARRIVAL_RELEASE_M = 8;         // 도착 latch 해제 거리

  // 웹 데모용 추가 위치 보정
  const MAX_WALK_SPEED_MPS = 4.5;      // 약 16km/h 이상 점프는 보행으로 보기 어려움
  const ROUTE_SNAP_MAX_M = 14;         // 경로선에서 너무 멀면 스냅하지 않음
  const ROUTE_SNAP_FULL_M = 5;         // 이 거리 안에서는 강하게 경로선에 붙임
  const STALE_SAMPLE_MS = 5000;        // 너무 오래된 위치 샘플 무시


  // 카메라 실제 FOV를 웹에서 정확히 얻기 어렵기 때문에 일반 후면 광각의
  // 체감값을 사용한다. 화면 밖 목표도 유도선 곡률에는 계속 반영한다.
  // ---- 카메라(투영) 모델 ----
  // pitch(카메라가 수평보다 아래를 보는 각도)는 기본적으로 아래 고정값을
  // 쓰지만, 방향센서(beta)가 들어오기 시작하면 실시간 값으로 대체된다.
  const H_FOV = 64;              // 카메라 수평 화각(도)
  const CAM_HEIGHT = 1.3;        // 카메라(폰) 높이(m), 지면 기준
  const CAM_PITCH_DEG_DEFAULT = 8; // 센서 값이 없을 때 쓰는 기본 피치(도)
  const PITCH_MIN_DEG = -20;     // 폰을 위로 들었을 때(하늘 쪽) 허용 최소 피치
  const PITCH_MAX_DEG = 55;      // 폰을 아래로 숙였을 때 허용 최대 피치
  const NEAR_CLIP = 0.8;         // 카메라 앞 이 거리(m 환산) 안쪽은 그리지 않음(뒤로 넘어간 구간 컷)

  // ---- 유도선(지면 경로) 모델 ----
  const WORLD_WIDTH = 2.24;       // 유도선 폭(m)
  const ROUTE_MAX_LEN_M = 50;     // 50m 밖에서는 이 길이를 유지
  const ROUTE_MIN_LEN_M = 2.5;    // 최종 도착 직전에도 최소한의 시인성 유지
  const ROUTE_SHRINK_MPS = 3.2;   // 갑작스런 짧아짐 방지: 초당 최대 감소량
  const ROUTE_GROW_MPS = 5.0;     // 목표 전환/GPS 튐 시 갑작스런 길어짐 방지
  const ROUTE_LEN_RESPONSE = 3.0; // 목표 거리 추종 강도(낮을수록 더 부드러움)
  const PATH_STEPS = 90;          // 곡선 샘플 수

  // ---- 흐르는 화살표(chevron) 모델 ----
  // 화면 픽셀이 아니라 지면 위 실제 미터 단위로 배치한 뒤 project()로
  // 투영하기 때문에, 리본과 완전히 같은 원근감(가까울수록 크게)을 갖는다.
  const CHEVRON_SPACING_M = 2.6;  // 화살표 사이 간격(m)
  const CHEVRON_SPEED_MPS = 3.2;  // 화살표가 목표를 향해 흐르는 속도(m/s)
  const CHEVRON_WIDTH_M = 0.62;   // 화살표 폭(m)
  const CHEVRON_LEN_M = 0.95;     // 화살표 길이(m)
  const CHEVRON_POOL_SIZE = 26;   // 동시에 그릴 수 있는 최대 화살표 개수

  const camera = document.getElementById('camera');
  const routeSvg = document.getElementById('routeSvg');
  const routeRibbon = document.getElementById('routeRibbon');
  const routeShadow = document.getElementById('routeShadow');
  const routeBottomSkirt = document.getElementById('routeBottomSkirt');
  const routeRim = document.getElementById('routeRim');
  const routeEndBorder = document.getElementById('routeEndBorder');
  const routeChevrons = document.getElementById('routeChevrons');
  const routeEndPulse = document.getElementById('routeEndPulse');
  const routeEndHalo = document.getElementById('routeEndHalo');
  const routeEndDot = document.getElementById('routeEndDot');

  const chevronPool = [];
  for(let i=0;i<CHEVRON_POOL_SIZE;i++){
    const el = document.createElementNS('http://www.w3.org/2000/svg','path');
    el.setAttribute('opacity','0');
    routeChevrons.appendChild(el);
    chevronPool.push(el);
  }

  const distValue = document.getElementById('distValue');
  const goalLabel = document.getElementById('goalLabel');
  const edgeHint = document.getElementById('edgeHint');
  const sensorToast = document.getElementById('sensorToast');

  const gpsStatus = document.getElementById('gpsStatus');
  const headingStatus = document.getElementById('headingStatus');
  const debug = document.getElementById('debug');
  const startBtn = document.getElementById('startBtn');
  const prevTargetBtn = document.getElementById('prevTargetBtn');
  const nextTargetBtn = document.getElementById('nextTargetBtn');
  const debugBtn = document.getElementById('debugBtn');

  const mapTargetBtn = document.getElementById('mapTargetBtn');
  const targetMapModal = document.getElementById('targetMapModal');
  const targetMapClose = document.getElementById('targetMapClose');
  const targetMapConfirm = document.getElementById('targetMapConfirm');
  const targetCoordText = document.getElementById('targetCoordText');

  let targetMap = null;
  let targetMapMarker = null;
  let pendingTargetLatLng = null;

  let currentPos = null;
  let targetBearing = null;
  let targetDistance = null;

  let targetIndex = 0;
  let arrivalLatched = false;
  let arrivalConfirmCount = 0;

  // GPS smoothing state
  const gpsHistory = [];
  let filteredPos = null;
  let lastAcceptedRawPos = null;
  let lastAcceptedTimestamp = null;
  let lastRawAccuracy = null;
  let lastSnapDistance = null;
  let lastSnapStrength = 0;

  // raw sensor state
  let rawHeading = null;

  // filtered heading / route state
  let filteredHeading = null;
  let visualDiff = 0;
  let desiredDiff = 0;
  let alignedLock = false;
  let previousRawDiff = null;

  let rawPitch = 0;
  // 기기 기울기(pitch) 필터링 상태.
  let filteredPitchDeg = null;

  let chevronPhase = 0;
  let lastTs = null;

  // 목표까지의 실제 거리를 따라 유도선 길이를 부드럽게 변화시키는 상태.
  // 목표가 바뀌거나 GPS가 순간적으로 튀어도 이 값은 갑자기 변하지 않는다.
  let smoothedRouteLengthM = ROUTE_MAX_LEN_M;
  let lastRouteLengthTs = null;

  // 목표 마커 전용 화면 좌표 안정화 상태
  let markerScreenX = null;
  let markerScreenY = null;
  let markerLastTs = null;

  let rafId = null;
  let started = false;

  // 방향 센서 불안정 감지 / 토스트
  const headingJitterSamples = [];
  let compassPoorCount = 0;
  let directCompassAccuracyAvailable = false;
  let lastCompassToastAt = 0;
  let lastToastMessage = '';
  let toastTimer = null;
  const COMPASS_TOAST_COOLDOWN_MS = 30000;

  function toRad(d){ return d * Math.PI / 180; }
  function toDeg(r){ return r * 180 / Math.PI; }
  function norm360(d){ return (d % 360 + 360) % 360; }
  function norm180(d){ return ((d + 540) % 360) - 180; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function haversine(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dp = toRad(lat2-lat1), dl = toRad(lon2-lon1);
    const a = Math.sin(dp/2)**2 +
      Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function bearing(lat1, lon1, lat2, lon2){
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dl = toRad(lon2-lon1);
    const y = Math.sin(dl)*Math.cos(p2);
    const x = Math.cos(p1)*Math.sin(p2) -
      Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
    return norm360(toDeg(Math.atan2(y,x)));
  }

  function formatDistance(m){
    if(m == null) return '-';
    if(m < 1000) return `${Math.round(m).toLocaleString()}m`;
    return `${(m/1000).toFixed(1)}km`;
  }

  function getGpsQuality(accuracy){
    if(!Number.isFinite(accuracy)) return {label:'수신 대기', level:'waiting'};
    if(accuracy <= 5)  return {label:'좋음', level:'good'};
    if(accuracy <= 12) return {label:'보통', level:'normal'};
    return {label:'불량', level:'poor'};
  }

  function latLonToLocalMeters(lat, lon, refLat, refLon){
    const R = 6371000;
    const x = toRad(lon - refLon) * R * Math.cos(toRad((lat + refLat) / 2));
    const y = toRad(lat - refLat) * R;
    return {x, y};
  }

  function localMetersToLatLon(x, y, refLat, refLon){
    const R = 6371000;
    const lat = refLat + toDeg(y / R);
    const lon = refLon + toDeg(x / (R * Math.cos(toRad((lat + refLat) / 2))));
    return {latitude: lat, longitude: lon};
  }

  function nearestPointOnSegmentMeters(pos, a, b){
    const refLat = pos.latitude;
    const refLon = pos.longitude;

    const p = {x:0, y:0};
    const aa = latLonToLocalMeters(a.lat, a.lon, refLat, refLon);
    const bb = latLonToLocalMeters(b.lat, b.lon, refLat, refLon);

    const vx = bb.x - aa.x;
    const vy = bb.y - aa.y;
    const len2 = vx*vx + vy*vy;

    if(len2 < 0.0001){
      return {
        latitude: a.lat,
        longitude: a.lon,
        distance: Math.hypot(aa.x, aa.y),
        t: 0
      };
    }

    let t = ((p.x-aa.x)*vx + (p.y-aa.y)*vy) / len2;
    t = clamp(t, 0, 1);

    const qx = aa.x + vx*t;
    const qy = aa.y + vy*t;

    const ll = localMetersToLatLon(qx, qy, refLat, refLon);

    return {
      latitude: ll.latitude,
      longitude: ll.longitude,
      distance: Math.hypot(qx, qy),
      t
    };
  }

  function applyRouteSnap(pos){
    // 목표1 이전에는 출발 경로가 없으므로 GPS를 그대로 사용한다.
    if(targetIndex <= 0){
      lastSnapDistance = null;
      lastSnapStrength = 0;
      return pos;
    }

    const prev = TARGETS[targetIndex - 1];
    const curr = TARGETS[targetIndex];
    const snap = nearestPointOnSegmentMeters(pos, prev, curr);

    lastSnapDistance = snap.distance;

    // 현재 위치가 경로에서 너무 멀면 다른 길일 가능성이 있으므로 스냅하지 않는다.
    if(snap.distance > ROUTE_SNAP_MAX_M){
      lastSnapStrength = 0;
      return pos;
    }

    // accuracy가 나쁠수록 경로선 신뢰도를 높인다.
    const accFactor = clamp((pos.accuracy - 3) / 10, 0, 1);

    // 경로선에 가까울수록 강하게 붙인다.
    const distanceFactor =
      snap.distance <= ROUTE_SNAP_FULL_M
        ? 1
        : clamp(
            1 - (snap.distance - ROUTE_SNAP_FULL_M) /
                (ROUTE_SNAP_MAX_M - ROUTE_SNAP_FULL_M),
            0,
            1
          );

    // 최소 35%, accuracy가 나쁠 때 최대 약 90%까지 스냅.
    const strength = distanceFactor * (0.35 + 0.55 * accFactor);
    lastSnapStrength = strength;

    return {
      latitude: pos.latitude + (snap.latitude - pos.latitude) * strength,
      longitude: pos.longitude + (snap.longitude - pos.longitude) * strength,
      accuracy: pos.accuracy
    };
  }

  function distanceBetweenPos(a, b){
    if(!a || !b) return Infinity;
    return haversine(a.latitude, a.longitude, b.latitude, b.longitude);
  }

  function addGpsSample(sample){
    const now = Date.now();

    // 너무 오래 전에 만들어진 위치는 사용하지 않는다.
    if(sample.timestamp && now - sample.timestamp > STALE_SAMPLE_MS){
      return false;
    }

    // 정확도가 너무 나쁜 샘플은 경로 계산에 사용하지 않는다.
    if(!Number.isFinite(sample.accuracy) || sample.accuracy > GPS_MAX_ACCURACY_M){
      return false;
    }

    lastRawAccuracy = sample.accuracy;

    if(lastAcceptedRawPos && lastAcceptedTimestamp){
      const dt = Math.max(0.2, (sample.timestamp - lastAcceptedTimestamp) / 1000);
      const jump = distanceBetweenPos(lastAcceptedRawPos, sample);
      const impliedSpeed = jump / dt;

      // 1) 큰 순간 점프
      if(jump > GPS_JUMP_LIMIT_M && sample.accuracy > 6){
        return false;
      }

      // 2) 보행 중이라고 보기 어려운 순간 속도
      // accuracy가 매우 좋은 샘플(<=4m)은 조금 관대하게 통과.
      if(impliedSpeed > MAX_WALK_SPEED_MPS && sample.accuracy > 4){
        return false;
      }
    }

    lastAcceptedRawPos = sample;
    lastAcceptedTimestamp = sample.timestamp;

    gpsHistory.push(sample);
    if(gpsHistory.length > GPS_HISTORY_SIZE){
      gpsHistory.shift();
    }

    // 최근 샘플들의 accuracy 가중 평균.
    // 최근 샘플에 약간 더 높은 시간 가중치도 부여한다.
    let sumW = 0;
    let lat = 0;
    let lon = 0;
    let acc = 0;

    for(let i=0;i<gpsHistory.length;i++){
      const p = gpsHistory[i];
      const ageWeight = 0.65 + 0.35 * ((i + 1) / gpsHistory.length);
      const accuracyWeight = 1 / Math.max(1, p.accuracy * p.accuracy);
      const w = accuracyWeight * ageWeight;

      sumW += w;
      lat += p.latitude * w;
      lon += p.longitude * w;
      acc += p.accuracy * w;
    }

    let weighted = {
      latitude: lat / sumW,
      longitude: lon / sumW,
      accuracy: acc / sumW
    };

    if(!filteredPos){
      filteredPos = weighted;
    }else{
      const move = distanceBetweenPos(filteredPos, weighted);

      // 정지 상태: GPS drift를 거의 고정.
      if(move <= GPS_STILL_RADIUS_M){
        const alpha = 0.08;
        filteredPos = {
          latitude:
            filteredPos.latitude +
            (weighted.latitude - filteredPos.latitude) * alpha,
          longitude:
            filteredPos.longitude +
            (weighted.longitude - filteredPos.longitude) * alpha,
          accuracy: weighted.accuracy
        };
      }else{
        // 실제 이동은 거리와 accuracy에 따라 적응적으로 추종.
        const accuracyFactor = clamp((12 - weighted.accuracy) / 9, 0, 1);

        let alpha =
          move > 8 ? 0.58 :
          move > 4 ? 0.42 :
                     0.28;

        alpha *= 0.75 + accuracyFactor * 0.25;

        filteredPos = {
          latitude:
            filteredPos.latitude +
            (weighted.latitude - filteredPos.latitude) * alpha,
          longitude:
            filteredPos.longitude +
            (weighted.longitude - filteredPos.longitude) * alpha,
          accuracy: weighted.accuracy
        };
      }
    }

    // 현재 활성 경로 구간에 대한 map-matching 보정.
    const snapped = applyRouteSnap(filteredPos);

    currentPos = {
      latitude: snapped.latitude,
      longitude: snapped.longitude,
      accuracy: filteredPos.accuracy
    };

    return true;
  }

  function getActiveTarget(){
    return TARGETS[targetIndex];
  }

  function updateTargetUi(){
    goalLabel.textContent = `${getActiveTarget().name} / ${TARGETS.length} · ${getActiveTarget().guide}`;
    prevTargetBtn.disabled = targetIndex <= 0;
    nextTargetBtn.disabled = targetIndex >= TARGETS.length - 1;
  }

  function setTargetIndex(nextIndex, reason='manual'){
    const clamped = clamp(nextIndex, 0, TARGETS.length - 1);
    if(clamped === targetIndex) return;

    targetIndex = clamped;
    arrivalLatched = false;
    arrivalConfirmCount = 0;
    lastSnapDistance = null;
    lastSnapStrength = 0;
    alignedLock = false;
    previousRawDiff = null;
    desiredDiff = 0;
    visualDiff = 0;
    targetBearing = null;
    lastRouteLengthTs = null;
    markerScreenX = null;
    markerScreenY = null;
    markerLastTs = null;

    updateTargetUi();
    updateTargetFromGps();
  }

  function updateTargetFromGps(){
    if(!currentPos) return;

    const target = getActiveTarget();

    const nextTargetBearing = bearing(
      currentPos.latitude, currentPos.longitude,
      target.lat, target.lon
    );

    // GPS 위치가 몇 m만 흔들려도 목표 방위각이 계속 바뀔 수 있으므로
    // 목표 방위각 자체도 저역통과 필터로 부드럽게 만든다.
    if(targetBearing == null){
      targetBearing = nextTargetBearing;
    }else{
      const bearingDelta = norm180(nextTargetBearing - targetBearing);
      const absBearingDelta = Math.abs(bearingDelta);

      if(absBearingDelta >= 0.9){
        const bearingAlpha =
          absBearingDelta > 25 ? 0.32 :
          absBearingDelta > 12 ? 0.20 :
          absBearingDelta > 5  ? 0.11 :
                                 0.055;

        targetBearing = norm360(targetBearing + bearingDelta * bearingAlpha);
      }
    }

    targetDistance = haversine(
      currentPos.latitude, currentPos.longitude,
      target.lat, target.lon
    );

    distValue.textContent = formatDistance(targetDistance);

    // 5m 안에 "연속으로" 들어온 것이 확인될 때만 다음 목표로 전환.
    // GPS 한 번 튄 값으로 자동 전환되는 것을 방지한다.
    if(targetDistance <= ARRIVAL_RADIUS_M){
      arrivalConfirmCount += 1;

      if(!arrivalLatched && arrivalConfirmCount >= ARRIVAL_CONFIRM_COUNT){
        arrivalLatched = true;

        if(targetIndex < TARGETS.length - 1){
          setTargetIndex(targetIndex + 1, 'arrival');
          return;
        }
      }
    }else{
      arrivalConfirmCount = 0;

      if(targetDistance >= ARRIVAL_RELEASE_M){
        arrivalLatched = false;
      }
    }
  }

  function showSensorToast(message, duration=4200){
    const now = Date.now();

    // 같은 토스트가 이미 화면에 떠 있으면 다시 시작하지 않는다.
    if(sensorToast.classList.contains('show') && lastToastMessage === message){
      return;
    }

    // 어떤 감지 로직에서 호출됐든 하나의 공통 쿨다운을 사용한다.
    if(now - lastCompassToastAt < COMPASS_TOAST_COOLDOWN_MS) return;

    lastCompassToastAt = now;
    lastToastMessage = message;
    sensorToast.textContent = message;
    sensorToast.classList.add('show');

    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{
      sensorToast.classList.remove('show');
    }, duration);
  }

  function recordHeadingStability(heading){
    // webkitCompassAccuracy가 실제로 제공되는 기기에서는 직접 정확도만 사용한다.
    // 두 감지기가 동시에 토스트를 만들지 않게 하기 위한 분기다.
    if(directCompassAccuracyAvailable) return;

    const now = performance.now();
    headingJitterSamples.push({t:now, h:norm360(heading)});

    while(headingJitterSamples.length &&
          now - headingJitterSamples[0].t > 2500){
      headingJitterSamples.shift();
    }

    if(headingJitterSamples.length < 8) return;

    let totalMotion = 0;
    let signChanges = 0;
    let lastSign = 0;

    for(let i=1;i<headingJitterSamples.length;i++){
      const d = norm180(
        headingJitterSamples[i].h - headingJitterSamples[i-1].h
      );

      totalMotion += Math.abs(d);

      const sign = Math.abs(d) < 1.2 ? 0 : Math.sign(d);
      if(sign && lastSign && sign !== lastSign) signChanges++;
      if(sign) lastSign = sign;
    }

    const netMotion = Math.abs(norm180(
      headingJitterSamples[headingJitterSamples.length-1].h -
      headingJitterSamples[0].h
    ));

    // 짧은 시간에 좌우로 크게 출렁이지만 최종 방향 변화는 작은 경우를
    // 자력계가 불안정한 패턴으로 간주한다.
    if(totalMotion > 75 && netMotion < 18 && signChanges >= 3){
      showSensorToast(
        '방향이 불안정합니다. 휴대폰을 8자 모양으로 움직여 방향 센서를 보정해 주세요.'
      );
      headingJitterSamples.length = 0;
    }
  }

  function ingestHeading(newHeading){
    if(!Number.isFinite(newHeading)) return;

    rawHeading = norm360(newHeading);
    recordHeadingStability(rawHeading);

    if(filteredHeading == null){
      filteredHeading = rawHeading;
      return;
    }

    const delta = norm180(rawHeading-filteredHeading);

    // 작은 자력계 떨림은 유도선까지 전달하지 않는다.
    if(Math.abs(delta) < 1.2) return;

    // 실제 회전은 따라가되 기존보다 한 단계 더 완만하게 반영한다.
    const alpha =
      Math.abs(delta) > 40 ? 0.40 :
      Math.abs(delta) > 22 ? 0.30 :
      Math.abs(delta) > 10 ? 0.20 :
      Math.abs(delta) > 4  ? 0.12 :
                             0.06;

    filteredHeading = norm360(filteredHeading + delta*alpha);
  }

  // 기기를 앞/뒤로 기울인 정도(pitch)를 부드럽게 필터링한다.
  // ingestHeading과 같은 방식(변화가 클수록 빠르게 따라가고, 작은 떨림은
  // 무시)을 쓰되 각도 랩어라운드가 없으므로 단순 뺄셈으로 delta를 구한다.
  function ingestPitch(betaDeg){
    if(!Number.isFinite(betaDeg)) return;

    // beta=90 → 폰이 수직으로 서서 카메라가 지평선을 정면으로 볼 때.
    // 90보다 작아질수록(폰 위쪽이 앞으로/아래로 기울수록) 카메라가 더 아래를 본다.
    const rawPitch = clamp(90-betaDeg, PITCH_MIN_DEG, PITCH_MAX_DEG);

    if(filteredPitchDeg == null){
      filteredPitchDeg = rawPitch;
      return;
    }

    const delta = rawPitch-filteredPitchDeg;
    if(Math.abs(delta) < 0.6) return;

    const alpha =
      Math.abs(delta) > 22 ? 0.28 :
      Math.abs(delta) > 11 ? 0.18 :
      Math.abs(delta) > 5  ? 0.11 :
                             0.06;

    filteredPitchDeg += delta*alpha;
  }

  function handleOrientation(e){
    let h = null;

    const screenAngle =
      (screen.orientation && typeof screen.orientation.angle === 'number')
        ? screen.orientation.angle
        : (typeof window.orientation === 'number' ? window.orientation : 0);

    if(typeof e.webkitCompassHeading === 'number'){
      h = e.webkitCompassHeading;

      // iOS/Safari 계열에서 제공되는 경우 직접적인 나침반 정확도도 활용한다.
      if(Number.isFinite(e.webkitCompassAccuracy)){
        directCompassAccuracyAvailable = true;
        headingJitterSamples.length = 0;

        if(e.webkitCompassAccuracy > 25){
          compassPoorCount++;
          if(compassPoorCount >= 8){
            showSensorToast(
              '방향 정확도가 낮습니다. 휴대폰을 8자 모양으로 움직여 방향 센서를 보정해 주세요.'
            );
            compassPoorCount = 0;
          }
        }else{
          compassPoorCount = 0;
        }
      }
    }else if(typeof e.alpha === 'number'){
      h = norm360(360 - e.alpha + screenAngle);
    }

    if(h != null) ingestHeading(h);

    // 화면 회전 상태에 따라 beta/gamma 중 실제 "앞뒤 기울기"에 해당하는
    // 축을 고른다. 이 앱은 세로 모드 사용을 기준으로 설계됐다.
    if(typeof e.beta === 'number' && typeof e.gamma === 'number'){
      let tilt;
      if(screenAngle === 90){
        tilt = -e.gamma;
      }else if(screenAngle === -90 || screenAngle === 270){
        tilt = e.gamma;
      }else if(screenAngle === 180){
        tilt = -e.beta;
      }else{
        tilt = e.beta;
      }
      ingestPitch(tilt);
    }
  }

  function updateSmoothedRouteLength(ts){
    const now = Number.isFinite(ts) ? ts : performance.now();

    const desired =
      Number.isFinite(targetDistance)
        ? clamp(targetDistance, ROUTE_MIN_LEN_M, ROUTE_MAX_LEN_M)
        : ROUTE_MAX_LEN_M;

    if(lastRouteLengthTs == null){
      lastRouteLengthTs = now;
      smoothedRouteLengthM = desired;
      return smoothedRouteLengthM;
    }

    const dt = clamp((now - lastRouteLengthTs) / 1000, 0, 0.08);
    lastRouteLengthTs = now;

    if(dt <= 0) return smoothedRouteLengthM;

    const delta = desired - smoothedRouteLengthM;

    // 지수형 smoothing으로 목표값을 따라가되,
    // 한 프레임에서 변할 수 있는 길이를 초당 변화량으로 한 번 더 제한한다.
    const response = 1 - Math.exp(-ROUTE_LEN_RESPONSE * dt);
    let step = delta * response;

    const maxStep =
      (step < 0 ? ROUTE_SHRINK_MPS : ROUTE_GROW_MPS) * dt;

    step = clamp(step, -ROUTE_SHRINK_MPS * dt, ROUTE_GROW_MPS * dt);

    if(Math.abs(delta) < 0.03){
      smoothedRouteLengthM = desired;
    }else{
      smoothedRouteLengthM += step;
    }

    return clamp(
      smoothedRouteLengthM,
      ROUTE_MIN_LEN_M,
      ROUTE_MAX_LEN_M
    );
  }

  // 카메라(핀홀) 투영: 지면 위 좌표(x=좌우 m, z=전방 m)를 화면 픽셀로 변환.
  // 카메라 뒤쪽(camZ <= NEAR_CLIP)이면 null을 반환해 그리지 않는다.
  function project(x, z, W, H, f, pitchRad){
    const camY = z*Math.sin(pitchRad) - CAM_HEIGHT*Math.cos(pitchRad);
    const camZ = CAM_HEIGHT*Math.sin(pitchRad) + z*Math.cos(pitchRad);
    if(camZ <= NEAR_CLIP) return null;
    return {
      x: W/2 + f*(x/camZ),
      y: H/2 - f*(camY/camZ)
    };
  }

  // 목표 방향과 현재 진행 방향의 차이(diff, 도)를 이용해 지면 위의
  // 경로(세계 좌표)를 만들고, 그 경로를 카메라로 투영해 화면 리본을 그린다.
  // 각도 구간을 나눠 손으로 그리던 방식과 달리, 0~180° 어떤 값에서도
  // 하나의 연속된 곡선이라 경계에서 일그러지지 않는다. 곡선이 카메라
  // 뒤로 넘어가는 지점(급격한 U턴 등)은 자동으로 잘려서 표시된다.
  function buildRoute(diffDeg, routeLengthM){
    // 모바일 브라우저의 주소창/하단바 변화로 window.innerHeight와
    // 실제 SVG 표시 영역이 순간적으로 달라질 수 있으므로 SVG 실측 크기를 쓴다.
    const svgRect = routeSvg.getBoundingClientRect();
    const W = Math.max(1, svgRect.width);
    const H = Math.max(1, svgRect.height);
    const f = (W/2) / Math.tan(toRad(H_FOV/2));
    // 방향센서(beta)가 들어와 있으면 실시간 기울기를, 아니면 기본값을 쓴다.
    const pitchRad = toRad(filteredPitchDeg != null ? filteredPitchDeg : CAM_PITCH_DEG_DEFAULT);
    const pathLength = clamp(
      Number.isFinite(routeLengthM) ? routeLengthM : ROUTE_MAX_LEN_M,
      ROUTE_MIN_LEN_M,
      ROUTE_MAX_LEN_M
    );

    const diff = toRad(clamp(diffDeg, -180, 180));
    const absDeg = Math.min(180, Math.abs(diffDeg));

    // 회전이 클수록(급커브) 더 짧은 구간 안에서 방향을 트는 대신,
    // 지나치게 급하게 꺾이지 않도록 최소/최대 구간을 둔다.
    const turnLen = clamp(7 + absDeg*0.11, 7, 24);

    let x = 0, z = 0;
    const centerline = [{x, z, theta:0}];

    for(let i=1;i<=PATH_STEPS;i++){
      const s = i*(pathLength/PATH_STEPS);
      const t = clamp(s/turnLen, 0, 1);
      const ease = t*t*(3-2*t); // smoothstep: 방향 전환이 급격하지 않게
      const theta = diff*ease;
      const ds = pathLength/PATH_STEPS;

      x += Math.sin(theta)*ds;
      z += Math.cos(theta)*ds;

      centerline.push({x, z, theta});
    }

    const halfW = WORLD_WIDTH/2;
    const left = [], right = [], rim = [];

    for(let i=0;i<centerline.length;i++){
      const c = centerline[i];
      const nx = Math.cos(c.theta), nz = -Math.sin(c.theta); // 진행방향에 수직인 법선

      const lx = c.x + nx*halfW, lz = c.z + nz*halfW;
      const rx = c.x - nx*halfW, rz = c.z - nz*halfW;

      const lp = project(lx, lz, W, H, f, pitchRad);
      const rp = project(rx, rz, W, H, f, pitchRad);

      // 둘 중 하나라도 카메라 뒤로 넘어가면 그 지점부터는 경로를 끊는다.
      // 카메라 바로 앞(근접 클립 구간)은 아직 유효한 점이 하나도 없을 때만
      // 건너뛴다. 유효한 점들이 쌓인 이후에 클립되면(예: 급격한 U턴이
      // 카메라 뒤로 넘어갈 때) 그 지점에서 경로를 끊는다.
      if(!lp || !rp){
        if(left.length === 0) continue;
        break;
      }

      left.push(lp);
      right.push(rp);
      rim.push(lp);
    }

    if(left.length < 2){
      return { ribbonD:'', rimD:'', skirtD:'', centerline, end:null, W, H, f, pitchRad, pathLength };
    }

    // 화면 하단 시작점 고정:
    // 기울기나 투영 변화로 첫 유효 지점이 화면 위쪽에서 시작하더라도
    // 리본 시작부가 항상 화면 하단과 맞닿도록 하단 앵커를 추가한다.
    // 실제 첫 유효 단면을 기준으로 화면 아래쪽까지 충분히 연장한다.
    // 이 경로 자체와 별도로 routeBottomSkirt도 사용해 브라우저 UI 변화 시
    // 1프레임 정도의 좌표 불일치가 생겨도 하단에 카메라 영상이 비치지 않게 한다.
    const firstLeft = {...left[0]};
    const firstRight = {...right[0]};
    const bottomY = H + Math.max(360, H * 0.50);
    const bottomExpand = Math.max(W * 0.22, 120);

    const bottomLeftX = Math.min(firstLeft.x - bottomExpand, -W * 0.12);
    const bottomRightX = Math.max(firstRight.x + bottomExpand, W * 1.12);

    left.unshift({ x: bottomLeftX, y: bottomY });
    right.unshift({ x: bottomRightX, y: bottomY });
    rim.unshift({ x: bottomLeftX, y: bottomY });

    const skirtTopY = clamp(
      Math.max(firstLeft.y, firstRight.y) - 8,
      H - Math.max(170, H * 0.18),
      H
    );

    let ribbonD = `M ${left[0].x} ${left[0].y}`;
    for(let i=1;i<left.length;i++) ribbonD += ` L ${left[i].x} ${left[i].y}`;
    for(let i=right.length-1;i>=0;i--) ribbonD += ` L ${right[i].x} ${right[i].y}`;
    ribbonD += ' Z';

    let rimD = `M ${rim[0].x} ${rim[0].y}`;
    for(let i=1;i<rim.length;i++) rimD += ` L ${rim[i].x} ${rim[i].y}`;

    // 리본이 실제로 그려진 마지막 지점(=화면상 가장 먼 지점)을
    // 목적지 마커/펄스 위치로 사용한다.
    const li = left.length-1;
    const endLeft = { x:left[li].x, y:left[li].y };
    const endRight = { x:right[li].x, y:right[li].y };
    const end = {
      x: (endLeft.x+endRight.x)/2,
      y: (endLeft.y+endRight.y)/2
    };

    // 하단 전용 오버스캔 영역. 리본보다 뒤에서 같은 그라데이션으로 채운다.
    // 화면 아래쪽의 짧은 영역만 덮기 때문에 유도선 형태에는 영향을 주지 않는다.
    const skirtD =
      `M ${bottomLeftX} ${skirtTopY}` +
      ` L ${bottomRightX} ${skirtTopY}` +
      ` L ${bottomRightX} ${bottomY}` +
      ` L ${bottomLeftX} ${bottomY} Z`;

    return { ribbonD, rimD, skirtD, centerline, end, endLeft, endRight, W, H, f, pitchRad, pathLength };
  }

  function getStableTargetMarker(route, ts){
    if(
      !route ||
      targetBearing == null ||
      filteredHeading == null ||
      !Number.isFinite(targetDistance)
    ){
      return null;
    }

    // 실제 목표 방향과, 목표까지 남은 거리(최대 50m)를 직접 투영한다.
    // smoothedRouteLengthM을 사용해 GPS 거리값이 순간적으로 튀는 영향을 줄인다.
    const markerDistance = clamp(
      smoothedRouteLengthM,
      ROUTE_MIN_LEN_M,
      ROUTE_MAX_LEN_M
    );

    const markerDiff = toRad(
      clamp(norm180(targetBearing-filteredHeading), -180, 180)
    );

    const worldX = Math.sin(markerDiff)*markerDistance;
    const worldZ = Math.cos(markerDiff)*markerDistance;

    const projected = project(
      worldX, worldZ,
      route.W, route.H, route.f, route.pitchRad
    );

    if(!projected) return null;

    const targetMarkerOffsetY = clamp(route.H*0.065, 44, 72);
    const wantedX = projected.x;
    const wantedY = projected.y-targetMarkerOffsetY;
    const now = Number.isFinite(ts) ? ts : performance.now();

    if(markerScreenX == null || markerScreenY == null || markerLastTs == null){
      markerScreenX = wantedX;
      markerScreenY = wantedY;
      markerLastTs = now;
      return {x:markerScreenX, y:markerScreenY};
    }

    const dt = clamp((now-markerLastTs)/1000, 0, 0.08);
    markerLastTs = now;

    const dx = wantedX-markerScreenX;
    const dy = wantedY-markerScreenY;
    const movePx = Math.hypot(dx,dy);

    // 3px 이하는 센서/GPS 미세 흔들림으로 보고 고정한다.
    if(movePx <= 3){
      return {x:markerScreenX, y:markerScreenY};
    }

    // 큰 실제 회전은 빠르게, 작은 흔들림은 느리게 추종.
    const response =
      movePx > 120 ? 9.0 :
      movePx > 60  ? 6.0 :
      movePx > 24  ? 3.8 :
                     2.2;

    const alpha = 1-Math.exp(-response*dt);
    markerScreenX += dx*alpha;
    markerScreenY += dy*alpha;

    return {x:markerScreenX, y:markerScreenY};
  }

  // 지면 위 실제 미터 단위로 화살표를 배치하고 project()로 투영한다.
  // 리본과 동일한 카메라 모델을 쓰므로 원근감이 자연스럽게 일치한다.
  function updateChevrons(centerline, W, H, f, pitchRad, phaseM, spacingM, pathLength){
    const effectiveLength = clamp(pathLength || ROUTE_MAX_LEN_M, ROUTE_MIN_LEN_M, ROUTE_MAX_LEN_M);
    const ds = effectiveLength/PATH_STEPS;
    let d = ((phaseM % spacingM)+spacingM)%spacingM;
    let idx = 0;

    while(d < effectiveLength && idx < chevronPool.length){
      const fi = clamp(d/ds, 0, centerline.length-1);
      const i0 = Math.floor(fi);
      const i1 = Math.min(centerline.length-1, i0+1);
      const t = fi-i0;
      const c0 = centerline[i0], c1 = centerline[i1];

      const cx = lerp(c0.x,c1.x,t);
      const cz = lerp(c0.z,c1.z,t);
      const theta = lerp(c0.theta,c1.theta,t);

      const ux = Math.sin(theta), uz = Math.cos(theta);
      const nx = Math.cos(theta), nz = -Math.sin(theta);

      const backX = cx-ux*CHEVRON_LEN_M, backZ = cz-uz*CHEVRON_LEN_M;
      const leftX = backX+nx*CHEVRON_WIDTH_M, leftZ = backZ+nz*CHEVRON_WIDTH_M;
      const rightX = backX-nx*CHEVRON_WIDTH_M, rightZ = backZ-nz*CHEVRON_WIDTH_M;
      const tipX = cx+ux*CHEVRON_LEN_M*0.35, tipZ = cz+uz*CHEVRON_LEN_M*0.35;

      const pTip = project(tipX,tipZ,W,H,f,pitchRad);
      const pLeft = project(leftX,leftZ,W,H,f,pitchRad);
      const pRight = project(rightX,rightZ,W,H,f,pitchRad);

      if(pTip && pLeft && pRight){
        const distRatio = clamp(d/effectiveLength, 0, 1);
        let opacity = 0.88;
        if(distRatio < 0.04) opacity *= distRatio/0.04;
        if(distRatio > 0.82) opacity *= clamp((1-distRatio)/0.18, 0, 1);

        const size = Math.hypot(pTip.x-pLeft.x, pTip.y-pLeft.y);
        const strokeW = clamp(size*0.16, 1.4, 6);

        const el = chevronPool[idx++];
        el.setAttribute('d',
          `M ${pLeft.x.toFixed(1)} ${pLeft.y.toFixed(1)} L ${pTip.x.toFixed(1)} ${pTip.y.toFixed(1)} L ${pRight.x.toFixed(1)} ${pRight.y.toFixed(1)}`
        );
        el.setAttribute('stroke-width', strokeW.toFixed(1));
        el.setAttribute('opacity', opacity.toFixed(2));
      }

      d += spacingM;
    }

    for(;idx<chevronPool.length;idx++) chevronPool[idx].setAttribute('opacity','0');
  }

  function renderRoute(ts){
    if(targetBearing != null && rawHeading != null){
      const rawDiff = norm180(targetBearing-rawHeading);

      if(!alignedLock && Math.abs(rawDiff) <= 4){
        alignedLock = true;
      }else if(alignedLock && Math.abs(rawDiff) >= 7){
        alignedLock = false;
      }

      const crossedTarget =
        previousRawDiff != null &&
        Math.sign(previousRawDiff) !== Math.sign(rawDiff) &&
        Math.abs(rawDiff) < 12 &&
        Math.abs(previousRawDiff) < 12;

      previousRawDiff = rawDiff;

      if(alignedLock || crossedTarget){
        desiredDiff = 0;
        visualDiff *= 0.35;
      }else if(filteredHeading != null){
        desiredDiff = norm180(targetBearing-filteredHeading);
      }
    }

    const delta = norm180(desiredDiff-visualDiff);
    const absVisualDelta = Math.abs(delta);

    // 최종 화면 유도선에 별도의 dead-band를 둬 작은 좌우 출렁임을 억제한다.
    const visualAlpha =
      absVisualDelta > 75 ? 0.24 :
      absVisualDelta > 40 ? 0.17 :
      absVisualDelta > 18 ? 0.12 :
      absVisualDelta > 8  ? 0.075 :
                            0.045;

    if(absVisualDelta >= 1.25){
      visualDiff += delta*visualAlpha;
    }

    if(alignedLock && Math.abs(visualDiff) < 1.2){
      visualDiff = 0;
    }

    const routeLengthM = updateSmoothedRouteLength(ts);
    const route = buildRoute(visualDiff, routeLengthM);
    routeRibbon.setAttribute('d',route.ribbonD);
    routeShadow.setAttribute('d',route.ribbonD);
    routeBottomSkirt.setAttribute('d',route.skirtD || '');
    routeRim.setAttribute('d',route.rimD);

    // 가까워질수록 유도선 끝의 종료선을 더 두껍고 진하게 표시.
    if(route.endLeft && route.endRight){
      routeEndBorder.setAttribute(
        'd',
        `M ${route.endLeft.x.toFixed(1)} ${route.endLeft.y.toFixed(1)} ` +
        `L ${route.endRight.x.toFixed(1)} ${route.endRight.y.toFixed(1)}`
      );

      const proximity = 1-clamp(
        (route.pathLength-ROUTE_MIN_LEN_M) /
        (ROUTE_MAX_LEN_M-ROUTE_MIN_LEN_M),
        0, 1
      );

      const borderWidth = 2.5 + proximity*7.5;
      const borderOpacity = 0.30 + proximity*0.70;

      routeEndBorder.setAttribute('stroke-width', borderWidth.toFixed(1));
      routeEndBorder.setAttribute('opacity', borderOpacity.toFixed(2));
      routeEndBorder.style.display = '';
    }else{
      routeEndBorder.style.display = 'none';
    }

    // 첨부파일과 동일한 지면 미터 기반 chevron 애니메이션
    if(lastTs == null) lastTs = ts || performance.now();
    const dt = clamp((ts||performance.now())-lastTs, 0, 48);
    lastTs = ts || performance.now();
    chevronPhase += dt*CHEVRON_SPEED_MPS/1000;

    if(route.centerline){
      updateChevrons(
        route.centerline,
        route.W,
        route.H,
        route.f,
        route.pitchRad,
        chevronPhase,
        CHEVRON_SPACING_M,
        route.pathLength
      );
    }

    // 첨부파일과 동일한 목표지점 pulse / halo / dot
    const stableMarker = getStableTargetMarker(route, ts);

    if(stableMarker){
      routeEndPulse.setAttribute('cx', stableMarker.x);
      routeEndPulse.setAttribute('cy', stableMarker.y);
      routeEndHalo.setAttribute('cx', stableMarker.x);
      routeEndHalo.setAttribute('cy', stableMarker.y);
      routeEndDot.setAttribute('cx', stableMarker.x);
      routeEndDot.setAttribute('cy', stableMarker.y);
      routeEndPulse.style.display = '';
      routeEndHalo.style.display = '';
      routeEndDot.style.display = '';
    }else{
      routeEndPulse.style.display = 'none';
      routeEndHalo.style.display = 'none';
      routeEndDot.style.display = 'none';
    }

    const halfFov = H_FOV/2;
    const onScreen = Math.abs(visualDiff) <= halfFov;

    if(onScreen){
      edgeHint.style.display = 'none';
    }else{
      edgeHint.style.display = 'flex';
      if(visualDiff < 0){
        edgeHint.className = 'left';
        edgeHint.textContent = `← ${formatDistance(targetDistance)}`;
      }else{
        edgeHint.className = 'right';
        edgeHint.textContent = `${formatDistance(targetDistance)} →`;
      }
    }

    if(filteredHeading != null){
      headingStatus.textContent = `방향 ${Math.round(filteredHeading)}°`;
    }

    debug.textContent =
`목표: ${getActiveTarget().name} (${getActiveTarget().lat}, ${getActiveTarget().lon})
현재: ${currentPos ? currentPos.latitude.toFixed(7)+', '+currentPos.longitude.toFixed(7) : '-'}
거리: ${targetDistance != null ? targetDistance.toFixed(1)+' m' : '-'}
유도선 길이: ${smoothedRouteLengthM.toFixed(1)} m
GPS 상태: ${currentPos ? getGpsQuality(currentPos.accuracy).label : '수신 대기'}
GPS raw accuracy: ${lastRawAccuracy != null ? lastRawAccuracy.toFixed(1)+' m' : '-'}
GPS 보정 accuracy: ${currentPos ? currentPos.accuracy.toFixed(1)+' m' : '-'}
경로 이탈거리: ${lastSnapDistance != null ? lastSnapDistance.toFixed(1)+' m' : '-'}
경로 스냅강도: ${(lastSnapStrength*100).toFixed(0)}%
도착 확인: ${arrivalConfirmCount}/${ARRIVAL_CONFIRM_COUNT}
목표 방위각: ${targetBearing != null ? targetBearing.toFixed(1)+'°' : '-'}
필터 헤딩: ${filteredHeading != null ? filteredHeading.toFixed(1)+'°' : '-'}
카메라 피치: ${filteredPitchDeg != null ? filteredPitchDeg.toFixed(1)+'° (센서)' : CAM_PITCH_DEG_DEFAULT+'° (기본값)'}
방향 차이: ${visualDiff.toFixed(1)}°`;

    rafId = requestAnimationFrame(renderRoute);
  }

  async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    camera.srcObject = stream;
  }

  function startGPS(){
    if(!navigator.geolocation){
      gpsStatus.textContent = 'GPS 미지원';
      return;
    }

    navigator.geolocation.watchPosition(pos=>{
      const sample = {
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        timestamp: pos.timestamp || Date.now()
      };

      const accepted = addGpsSample(sample);

      if(accepted){
        const snapText =
          lastSnapDistance == null
            ? ''
            : ` · 경로 ${lastSnapDistance.toFixed(1)}m`;

        const gpsQuality = getGpsQuality(currentPos.accuracy);
        gpsStatus.textContent =
          `GPS ${gpsQuality.label} · ±${Math.round(currentPos.accuracy)}m${snapText}`;
        updateTargetFromGps();
      }else{
        const gpsQuality = getGpsQuality(pos.coords.accuracy);
        gpsStatus.textContent =
          `GPS ${gpsQuality.label} · ±${Math.round(pos.coords.accuracy)}m · 대기`;
      }
    },err=>{
      gpsStatus.textContent = 'GPS 오류';
      console.error(err);
    },{
      enableHighAccuracy:true,
      maximumAge:400,
      timeout:15000
    });
  }

  async function startOrientation(){
    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      const result = await DeviceOrientationEvent.requestPermission();
      if(result !== 'granted') throw new Error('방향 센서 권한 거부');
    }

    if('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute',handleOrientation,true);
    }else{
      window.addEventListener('deviceorientation',handleOrientation,true);
    }
  }

  function setPendingTarget(lat, lon, moveMap=false){
    pendingTargetLatLng = {lat, lon};
    targetCoordText.textContent =
      `${lat.toFixed(7)}, ${lon.toFixed(7)}`;

    if(targetMap){
      if(targetMapMarker){
        targetMapMarker.setLatLng([lat, lon]);
      }else{
        targetMapMarker = L.marker([lat, lon]).addTo(targetMap);
      }

      if(moveMap){
        targetMap.panTo([lat, lon]);
      }
    }
  }

  function ensureTargetMap(center){
    if(typeof L === 'undefined'){
      targetCoordText.textContent =
        '지도를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.';
      return false;
    }

    if(!targetMap){
      targetMap = L.map('targetMap', {
        zoomControl: true,
        attributionControl: true
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(targetMap);

      targetMap.on('click', e=>{
        setPendingTarget(e.latlng.lat, e.latlng.lng);
      });
    }

    targetMap.setView(center, 18);
    return true;
  }

  function openTargetMap(){
    const target = getActiveTarget();
    const center = currentPos
      ? [currentPos.latitude, currentPos.longitude]
      : [target.lat, target.lon];

    targetMapModal.classList.add('show');
    targetMapModal.setAttribute('aria-hidden', 'false');

    requestAnimationFrame(()=>{
      if(!ensureTargetMap(center)) return;

      targetMap.invalidateSize(true);

      // 열 때마다 현재 목표 좌표를 선택 상태로 표시한다.
      setPendingTarget(target.lat, target.lon, false);
    });
  }

  function closeTargetMap(){
    targetMapModal.classList.remove('show');
    targetMapModal.setAttribute('aria-hidden', 'true');
  }

  function applyPendingTarget(){
    if(!pendingTargetLatLng) return;

    const target = getActiveTarget();
    target.lat = pendingTargetLatLng.lat;
    target.lon = pendingTargetLatLng.lon;
    target.guide = '사용자 지정 목표';

    // 새 좌표를 즉시 현재 목표로 다시 계산한다.
    targetBearing = null;
    targetDistance = null;
    alignedLock = false;
    previousRawDiff = null;
    desiredDiff = 0;
    visualDiff = 0;
    arrivalLatched = false;
    arrivalConfirmCount = 0;
    lastSnapDistance = null;
    lastSnapStrength = 0;
    lastRouteLengthTs = null;
    markerScreenX = null;
    markerScreenY = null;
    markerLastTs = null;

    updateTargetUi();
    updateTargetFromGps();
    closeTargetMap();

    sensorToast.classList.remove('show');
    lastToastMessage = '';
    sensorToast.textContent = '지도에서 선택한 위치로 목표를 변경했습니다.';
    sensorToast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{
      sensorToast.classList.remove('show');
    }, 2600);
  }

  startBtn.addEventListener('click',async()=>{
    if(started) return;

    startBtn.disabled = true;
    startBtn.textContent = '시작 중…';

    try{
      await startCamera();
      startGPS();
      await startOrientation();

      started = true;
      startBtn.textContent = '실행 중';

      if(!rafId) rafId = requestAnimationFrame(renderRoute);
    }catch(err){
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = '권한 확인 후 다시 시작';
      alert('카메라·위치·방향 센서 권한을 허용해주세요. HTTPS 환경에서 실행해주세요.');
    }
  });

  prevTargetBtn.addEventListener('click',()=>{
    setTargetIndex(targetIndex - 1, 'manual');
  });

  nextTargetBtn.addEventListener('click',()=>{
    setTargetIndex(targetIndex + 1, 'manual');
  });

  debugBtn.addEventListener('click',()=>{
    debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
  });

  mapTargetBtn.addEventListener('click', openTargetMap);
  targetMapClose.addEventListener('click', closeTargetMap);
  targetMapConfirm.addEventListener('click', applyPendingTarget);

  window.addEventListener('resize',()=>{
    lastRouteLengthTs = null;
    if(!rafId) renderRoute(performance.now());
  });

  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>{
      lastRouteLengthTs = null;
    });
  }

  // 권한 전에도 레이아웃 형태는 보이도록 초기 렌더.
  routeRibbon.setAttribute('d','');
  routeShadow.setAttribute('d','');
  routeBottomSkirt.setAttribute('d','');
  routeRim.setAttribute('d','');
  routeEndBorder.setAttribute('d','');
  routeEndPulse.style.display = 'none';
  routeEndHalo.style.display = 'none';
  routeEndDot.style.display = 'none';
  updateTargetUi();
})();
</script>
</body>
